<title>Sazón &amp; Sugar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: recipe-blog home (hero, category rounds, card grid) + focused recipe sheet + full-screen cook mode + weekly prep board */
:root{
  --bg:#F7EBEE; --surface:#FFFFFF; --soft:#FBF3F5; --rose:#EBCBD4; --rose-2:#E2B6C3;
  --ink:#3B2330; --muted:#7A6170; --line:#EAD4DB; --accent:#8C4760; --accent-ink:#FFFFFF;
  --leaf:#4D6B3C; --warn:#B4532F;
  --t-drinks:#F1D3DB; --t-app:#EFDCC9; --t-dess:#F4C9D3; --t-dinner:#DCC6D2; --t-other:#E6D6E4;
  --shadow:0 1px 2px rgba(59,35,48,.06),0 8px 24px rgba(59,35,48,.07);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1317; --surface:#271B21; --soft:#2F2128; --rose:#4A3039; --rose-2:#5A3946;
  --ink:#F5E6EB; --muted:#BFA5B1; --line:#3D2A33; --accent:#E59AB3; --accent-ink:#2A141D;
  --leaf:#A9C78F; --warn:#F0A07E;
  --t-drinks:#4A2D37; --t-app:#46362B; --t-dess:#512C38; --t-dinner:#3C2C36; --t-other:#3A2E3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1317; --surface:#271B21; --soft:#2F2128; --rose:#4A3039; --rose-2:#5A3946;
  --ink:#F5E6EB; --muted:#BFA5B1; --line:#3D2A33; --accent:#E59AB3; --accent-ink:#2A141D;
  --leaf:#A9C78F; --warn:#F0A07E;
  --t-drinks:#4A2D37; --t-app:#46362B; --t-dess:#512C38; --t-dinner:#3C2C36; --t-other:#3A2E3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
em.it,.it{font-family:var(--display);font-style:italic;color:var(--accent);font-weight:500}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--rose-2);border-color:var(--accent)}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;letter-spacing:.02em;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--soft);border-color:var(--line);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}

/* top bar */
.topstrip{background:var(--accent);color:var(--accent-ink);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:6px 16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:26px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand .it{font-size:24px}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;padding:8px 12px;border-radius:999px}
nav.main a[aria-current="page"]{background:var(--rose);color:var(--ink)}
.status{font-size:12px;color:var(--muted)}

/* home */
.hero{padding-block:40px 18px;text-align:center}
.hero h1{font-size:clamp(30px,5vw,48px);max-width:18ch;margin:0 auto}
.hero p{color:var(--muted);max-width:52ch;margin:12px auto 0}
.search{max-width:520px;margin:22px auto 0;position:relative}
.search input{border-radius:999px;padding:12px 18px 12px 44px;background:var(--surface)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.cats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;padding-block:22px 8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font-size:13px;font-weight:600;color:var(--ink)}
.cat .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent;font-family:var(--display);font-size:28px;font-style:italic;color:var(--accent)}
.cat[aria-pressed="true"] .disc{border-color:var(--accent)}
.cat small{color:var(--muted);font-weight:500;font-size:12px;margin-top:-6px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-block:28px 14px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap}
.section-head h2{font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.thumb{aspect-ratio:4/3;width:100%;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .initial{font-family:var(--display);font-style:italic;font-size:64px;color:var(--accent);opacity:.85}
.thumb .fav{position:absolute;top:10px;right:10px;background:var(--surface);border-radius:999px;width:30px;height:30px;display:grid;place-items:center;color:var(--accent)}
.card .meta{padding:14px 16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .meta .label{font-size:11px;color:var(--accent)}
.card h3{font-size:19px}
.card .sub{font-size:13px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--rose-2);border-radius:var(--r);padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{font-size:22px}

/* recipe page */
.recipe{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;padding-block:28px 60px}
.recipe-head{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.recipe-head .thumb{border-radius:var(--r)}
.recipe-head h1{font-size:clamp(30px,4.5vw,46px)}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:18px;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.panel{background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:22px;margin-bottom:6px}
.scale{display:flex;gap:4px;background:var(--soft);border-radius:999px;padding:4px;width:max-content;max-width:100%;flex-wrap:wrap}
.scale button{border:0;background:none;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ing-sec{margin-top:16px}
.ing-sec h4,.step-sec h4{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.checks li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
ul.checks li:last-child{border-bottom:0}
.box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--rose-2);margin-top:2px;display:grid;place-items:center}
li.done .box{background:var(--accent);border-color:var(--accent)}
li.done .box::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
li.done .txt{text-decoration:line-through;color:var(--muted)}
.qty{font-weight:700}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
ol.steps li::before{content:counter(s);font-family:var(--display);font-style:italic;font-size:26px;color:var(--accent);line-height:1}
ol.steps li.done{color:var(--muted)}
ol.steps li.done::before{content:"✓";font-style:normal;font-size:20px}
.step-sec{margin-top:18px}
.notes p{margin:0 0 10px}
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:90px;align-self:start}
.timer-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border:1px solid var(--rose-2);background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.danger-zone{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* editor */
.editor{padding-block:28px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:860px;margin:0 auto}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600}
.sec-edit{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--soft)}
.sec-edit .sec-name{font-weight:600}
.items{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.items li{display:flex;gap:6px;align-items:flex-start}
.items li .n{flex:none;width:26px;padding-top:10px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.items li input,.items li textarea{flex:1;min-width:0}
.items li textarea{min-height:44px}
.items li .iconbtn{width:32px;height:32px;margin-top:4px}
.adder{display:flex;gap:8px;align-items:flex-start}
.adder input,.adder textarea{flex:1;min-width:0}
.photo-pick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-pick .thumb{width:160px;border-radius:12px}
.sticky-save{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;z-index:5}
.import-box{display:flex;flex-direction:column;gap:14px}
.steps-how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.steps-how div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.steps-how b{font-family:var(--display);font-style:italic;color:var(--accent);font-size:20px;display:block}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--soft);border:1px solid var(--line)}
.msg.err{border-color:var(--warn);color:var(--warn)}

/* prep */
.prep-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end;padding-block:32px 8px}
.prep-hero h1{font-size:clamp(32px,5vw,52px)}
.weekcard{background:var(--surface);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr;gap:12px}
.weekcard .label{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:8px}
.weekcard b{font-family:var(--display);font-size:24px;font-weight:600;display:block;font-variant-numeric:tabular-nums}
.weeknav{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border-radius:12px;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid transparent}
.day.today{border-color:var(--accent)}
.day h3{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.day h3 span{color:var(--muted);font-weight:500}
.meal{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.meal a{color:var(--ink);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.meal .row{gap:4px;justify-content:space-between}
.meal select{width:auto;padding:2px 6px;font-size:12px;border-radius:8px}
.meal .x{border:0;background:none;color:var(--muted);font-size:13px;padding:2px}
.addmeal{border:1px dashed var(--rose-2);background:none;border-radius:10px;padding:8px;font-size:13px;color:var(--accent);font-weight:600;margin-top:auto}
.prep-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:22px;padding-bottom:60px}
.shop-group h4{margin:14px 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.shop-group .from{font-size:12px;color:var(--muted)}
.batch{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.batch:last-child{border-bottom:0}
.batch a{color:var(--ink);font-weight:600;text-decoration:none}
.have{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--leaf);border:1px solid var(--leaf);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:1px}
.have.cart{color:var(--accent);border-color:var(--accent)}
.pantry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start}
.pitem{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .t{flex:1;min-width:0;overflow-wrap:anywhere}
.pitem.low .t::after{content:" · running low";color:var(--warn);font-size:12px;font-weight:600}
.pitem button{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px;border-radius:6px}
.pitem button:hover{color:var(--accent)}
.suggest{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.sug{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.sug .thumb{width:64px;border-radius:8px;flex:none}
.sug .thumb .initial{font-size:28px}
.meter{height:6px;border-radius:999px;background:var(--rose);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--leaf)}
.pill{font-size:12px;font-weight:700;background:var(--rose);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(30,15,22,.45);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .list{overflow:auto;padding:0 12px 14px}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px}
.pick:hover{background:var(--soft)}
.pick .thumb{width:56px;border-radius:8px;flex:none}
.pick .thumb .initial{font-size:24px}

/* cook mode */
.cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook-top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.cook-top .ttl{flex:1;min-width:0}
.cook-top .ttl div{font-family:var(--display);font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--rose)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.cook-body{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.cook-step{padding:36px max(20px,env(safe-area-inset-left,0px)) 24px max(20px,env(safe-area-inset-right,0px));max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.cook-step .num{font-family:var(--display);font-style:italic;color:var(--accent);font-size:22px}
.cook-step .txt{font-size:clamp(22px,3.2vw,32px);line-height:1.4;font-weight:500}
.cook-step .txt .qty{color:var(--accent)}
.cook-ings{background:var(--surface);border-left:1px solid var(--line);padding:20px;overflow:auto}
.cook-foot{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.cook-foot .btn{flex:1;justify-content:center;padding:14px}
.recipe-switch{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);font-weight:700}

/* timers */
.timers{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.timer{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);min-width:200px}
.timer b{font-variant-numeric:tabular-nums;font-size:22px;font-family:var(--display)}
.timer small{display:block;font-size:11px;opacity:.75;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:999px;width:30px;height:30px}
.timer.ring{background:var(--accent);color:var(--accent-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80}
footer.site{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:13px;text-align:center}

@media (max-width:900px){
  .recipe{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .recipe-head{grid-template-columns:minmax(0,1fr)}
  .days{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .prep-hero,.prep-cols{grid-template-columns:minmax(0,1fr)}
  .cook-body{grid-template-columns:minmax(0,1fr)}
  .cook-ings{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:560px){
  .brand{font-size:22px}
  nav.main{margin-left:0;width:100%;justify-content:space-between}
  nav.main a{padding:6px 10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card h3{font-size:16px}
  .card .meta{padding:10px 12px 14px}
  .thumb .initial{font-size:44px}
  .cat .disc{width:58px;height:58px;font-size:22px}
  .cats{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="topstrip">Recipes · Cook-along · Weekly meal prep</div>
<header class="top">

<script type="application/json" id="seed">{"recipes": {"coquito-tradicional": {"title": "Coquito Tradicional", "category": "Drinks", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["1 Lata leche evaporada", "1 Lata leche condensada", "1 Lata crema de coco", "1 Lata leche de coco", "1/3 Taza nutella", "1 Cucharadita extracto de vainilla", "½ - 1 tbsp canela en polvo", "1 Taza ron blanco (Opcional)"]}], "steps": [], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 0, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "coquito-de-nutella": {"title": "Coquito de Nutella", "category": "Drinks", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["1 Lata leche evaporada", "1 Lata leche condensada", "1 Lata crema de coco", "1 Lata leche de coco", "1/3 Taza nutella", "1 Cucharadita extracto de vainilla", "½ - 1 tbsp canela en polvo", "1 Taza ron blanco (Opcional)"]}], "steps": [], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 1, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "strawberry-lemonade": {"title": "Strawberry lemonade", "category": "Drinks", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["260mL of lemon juice (around 7 lemons, ~37mL per lemon)", "2.2L of cold water", "450mL granulated sugar", "300g frozen strawberries"]}], "steps": [], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 2, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "sorullitos": {"title": "Sorullitos", "category": "Appetizers", "source": "", "servings": "4-5 docenas", "time": "", "ingredients": [{"section": "Dulces", "items": ["6 tazas agua", "4 tazas harina", "1 1/4 taza azúcar", "1 1/4 tsp sal"]}, {"section": "Semi-Dulces", "items": ["6 tazas agua", "4 tazas harina", "1/2 taza azúcar", "2 1/4 tsp. sal"]}], "steps": [], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 3, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "strawberry-jam": {"title": "Strawberry Jam", "category": "Desserts", "source": "https://www.kyleecooks.com/small-batch-strawberry-jam/", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["1 pound fresh strawberries", "1 1/2 cup white sugar", "2 tablespoons lemon juice", "½ teaspoons lemon zest optional"]}], "steps": [{"section": "", "items": ["Wash and slice 1 pound fresh strawberries, removing the hulls and green tops.", "Add them to a saucepan, and mix 1 1/2 cup white sugar in well.", "Stir continually over medium heat, and bring the strawberries to boil.", "Once boiling, add 2 tablespoons lemon juice and ½ teaspoons lemon zest (if using).", "Boil for about 15 minutes, or until the jam reaches 220°F.", "Stir often, to make sure the jam doesn't burn.", "Pour into a jar and allow to cool.", "Cover and refrigerate.", "Use within about 2 weeks (if it lasts that long)."]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 4, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "strawberry-shortcake-cake": {"title": "Strawberry Shortcake Cake", "category": "Desserts", "source": "https://celebratingsweets.com/strawberry-shortcake-cake/", "servings": "", "time": "", "ingredients": [{"section": "Cake", "items": ["2½ cups all purpose flour, spooned and leveled", "3 teaspoons baking powder", "½ teaspoon salt", "1¾ cups granulated sugar", "½ cup vegetable or canola oil", "2 large eggs, room temperature", "2 large egg whites, room temperature", "2½ teaspoons pure vanilla extract", "½ teaspoon almond extract, optional, but highly recommended", "⅔ cup sour cream", "¾ cup milk, preferably whole or 2%, room temperature"]}, {"section": "Filling", "items": ["3 cups sliced or diced fresh strawberries, divided", "2 tablespoons strawberry jam", "additional whole strawberries, for garnish, optional"]}, {"section": "Frosting", "items": ["8 ounces cream cheese, softened to cool room temp", "1 cup powdered sugar", "¾ teaspoon vanilla extract", "2¼ cups heavy whipping cream, really cold, straight from the fridge"]}], "steps": [{"section": "Cake", "items": ["Preheat oven to 350°F.", "In a medium bowl, whisk flour, baking powder, and salt until combined. Set aside.", "Using a stand mixer fitted with the paddle attachment (preferred) or a hand mixer, beat sugar, oil, eggs, egg whites, and extracts until combined. Add the sour cream and beat until combined. Add half of the flour mixture, beating until just combined. While still beating, slowly add milk, then the remaining flour mixture. Scrape the sides and bottom of the bowl as needed. Be careful not to overmix it.", "Line three 8-inch cake pans** with parchment paper and grease the pans. Evenly divide the batter between the three pans. Tap/gently drop the pans on the countertop a couple times to remove any air bubbles.", "Bake for 18-22 minutes, until a toothpick inserted into the center comes out clean. If necessary, rotate the pans once during bake time to ensure even browning. Place the pans on a rack to cool completely."]}, {"section": "Filling", "items": ["Combine the strawberries and jam and set aside (these will be used for the filling and topping). Note: I slice the strawberries for the filling (about 2½ cups), and I diced the strawberries for the top of the cake (about ½ cup). You can slice or dice, your choice. You'll need about 3 cups total."]}, {"section": "Frosting", "items": ["Place the cream cheese, powdered sugar, and vanilla extract in a large mixing bowl. Using a stand mixer with a whisk attachment (preferred) or hand mixer, beat the mixture on medium speed until smooth. While the mixer is still whipping, slowly pour the heavy cream down the side of the bowl. Stop and scrape the bottom and sides of the bowl periodically. Increase the speed to high and continue whipping until the cream can hold a stiff peak. It is important that the cream stays cold so that it will thicken properly. If you're using a hand mixer hold the bowl near the top and don't hold the bowl against your body."]}, {"section": "Assembly", "items": ["Place one layer of cake on a platter. Top with one-third of the frosting, then top with about 1¼ cups of strawberries. Place another layer of cake on top and repeat. For the third/top of layer of cake, top with remaining whipped cream frosting, then place the remaining strawberries in the center. Decorate the outside with whole strawberries, if desired."]}], "notes": ["**CAKE PANS: Using three cake pans produces cake layers that are on the thinner side (my preference for filling and stacking). If you'd prefer the cake layers thicker, or you do not have three 8-inch round cake pans, you can divide the batter between two 8-inch cake pans. Increase the bake time to 22-27 minutes.", "Prefer a 9x13? That recipe is here: Strawberry Shortcake Sheet Cake (https://celebratingsweets.com/strawberry-shortcake-sheet-cake/).", "EGGS AND MILK: To quickly bring eggs and milk to room temperature place the four eggs in a bowl of really warm tap water for about 5 minutes. Microwave the milk to take the chill off, about 15 seconds.", "FROSTING: This frosting is stabilized with cream cheese, so it tastes like a cheesecake whipped cream. If you don't want the flavor of cream cheese you can use 8-oz of mascarpone cheese instead. Just be aware that the frosting will be softer than if you use cream cheese. Alternatively, you can use vanilla buttercream frosting (https://celebratingsweets.com/vanilla-buttercream-frosting/) or freshly whipped cream (https://celebratingsweets.com/easy-homemade-whipped-cream-10-flavors/). Note: the homemade whipped cream will not be as stable, so you'll want to assemble it right before serving.", "STORING: This cake is best served the day it is made. After assembly, refrigerate the cake, then bring to cool room temperature before serving.", "MAKE AHEAD: This cake is best the day it is made. If you have to make it ahead, you can prepare the following one day in advance. Note: do not assemble until the day you are serving. Bake and cool the cake layers and wrap in wax paper and plastic wrap and store in the refrigerator. Prepare the whipped cream frosting and store it in the refrigerator. The frosting may deflate as it sits for an extended time so you might need to re-whip it before assembling. Hold off on tossing the strawberries with jam until you are assembling the cake. Store assembled cake in the refrigerator and bring to cool room temperature before serving"], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 5, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "banana-chocolate-chip-muffins": {"title": "Banana Chocolate Chip Muffins", "category": "Desserts", "source": "", "servings": "12 muffins", "time": "", "ingredients": [{"section": "", "items": ["1⅔ cups all-purpose flour, spooned into measuring cup and leveled-off", "1 teaspoon baking powder", "1 teaspoon baking soda", "½ teaspoon salt", "½ cup (1 stick) unsalted butter, at room temperature", "¾ cup plus 2 tablespoons sugar", "2 large eggs", "1 cup mashed bananas, from 2 to 3 overripe bananas", "1 teaspoon vanilla extract", "⅓ cup sour cream or plain Greek yogurt (low-fat is fine)", "½ cup semi-sweet chocolate chips", "½ cup chopped walnuts"]}], "steps": [{"section": "", "items": ["Preheat the oven to 350°F (175°C) and set an oven rack in the middle position. Line a 12-cup muffin tin with paper liners.", "In a medium bowl, whisk together the flour, baking powder, baking soda, and salt. Set aside.", "In the bowl of an electric mixer, beat the butter and sugar on medium-high speed until fluffy, about 2 minutes. Scrape down the sides of the bowl with a rubber spatula.", "At medium speed, add the eggs one at a time, beating until fully incorporated between additions.", "Add the mashed bananas, vanilla, and sour cream (or Greek yogurt) and beat until blended (the batter will look a bit curdled; that's okay).", "Add the dry ingredients and mix on low speed until well blended.", "On low speed, mix in chocolate chips and nuts evenly into the batter.", "Spoon the batter into the prepared muffin tin (the cups will be very full) and sprinkle evenly with the reserved chocolate chips. Bake the muffins until the tops are golden and domed, 23 to 25 minutes. Let the muffins cool in the pan for 10 minutes, then turn them out onto a rack and let cool for at least 10 minutes before serving. The muffins are best fresh out of the oven but will keep for up to 4 days stored in a sealed container or resealable plastic bag, in a single layer (to prevent the muffins from getting soggy, line the top and bottom of the container or bag with a single layer of paper towels)."]}], "notes": ["By Jennifer Segal (https://www.onceuponachef.com/about-jenn-segal)", "Prep Time: 20 minutes", "Cook Time: 25 minutes", "Total Time: 45 minutes"], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 6, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "brown-butter-chocolate-chip-nut-cookies-instagram": {"title": "Brown Butter Chocolate Chip Nut Cookies (Instagram version)", "category": "Desserts", "source": "https://www.instagram.com/p/DcJKsIoRepC/", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["293 g all-purpose flour", "190 g dark brown sugar", "90 g granulated sugar", "2 sticks salted butter", "1 large egg + 1 egg yolk", "2 tbsp milk", "2 tsp vanilla extract", "1 tsp salt", "¾ tsp baking soda", "¼ tsp baking powder", "80 g crushed walnuts", "60 g chocolate chips", "Toffee (traders joes, store bought, or homemade)"]}], "steps": [{"section": "Brown the butter", "items": ["Place 227 g salted butter in a light-colored saucepan over medium heat.", "Melt completely, stirring/swirl occasionally. Continue cooking as it foams and bubbles.", "Once the milk solids turn deep golden brown and smell nutty/caramel-like, immediately remove from heat. DO NOT LET BURN.", "Pour into a metal mixing bowl, making sure to scrape in all the browned milk solids.", "Allow the butter to cool until it is no longer hot."]}, {"section": "Prepare the dry ingredients", "items": ["While the butter cools, combine in a separate bowl: 293 g flour, 1 tsp salt, ¾ tsp baking soda, ¼ tsp baking powder.", "Mix thoroughly and set aside."]}, {"section": "Prepare the wet mixture", "items": ["Combine 190 g dark brown sugar + 90 g granulated sugar.", "Mix until evenly distributed.", "Once the browned butter has cooled, add the sugar mixture to the butter.", "Mix thoroughly with a spatula until combined. To avoid overmixing, never use whisk or stand/hand mixer.", "Add 2 tsp vanilla, 1 whole egg, 1 egg yolk, 30 g milk, and mix with the spatula until the mixture is cohesive and the egg is fully incorporated."]}, {"section": "Add the dry ingredients", "items": ["Add half of the flour mixture.", "Fold with the spatula until partially incorporated. DO NOT mix until completely smooth. Allow clumps of flour to remain visible.", "Add the remaining flour mixture.", "Fold until mostly incorporated, leaving only a several CLUMPS of flour.", "Add walnuts and chocolate and mix until fully inforporated, leaving only some streaks of flour. Stop mixing as soon as there are no streaks of dry flour. Don't overmix."]}, {"section": "Refrigerate the dough", "items": ["Cover the bowl tightly.", "Refrigerate for at least 3 hours.", "For the best flavor and texture, refrigerate overnight."]}], "notes": ["Based on this recipe, modified for my taste."], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 7, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "brown-butter-chocolate-chip-nut-cookies": {"title": "Brown Butter chocolate chip nut cookies", "category": "Desserts", "source": "https://sturbridgebakery.com/chewy-brown-butter-chocolate-chip-cookies/", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["35 grams mini morsels of semi-sweet chocolate", "60g cup chopped nuts (walnuts and/or pecans)", "211 grams (15 tablespoons) unsalted butter (European style is preferred!), browned to 170 grams or 3/4 cup*", "150 grams (3/4 cup) light brown sugar", "50 grams (¼ cup) granulated sugar", "1/2 tablespoon vanilla extract", "1 egg, room temperature", "20 grams (1 heaping tablespoon) sour cream, room temperature", "1 teaspoon baking soda", "1 teaspoon baking powder", "1 teaspoon cornstarch", "1 teaspoon fine sea salt", "225 grams (about 1 3/4 cups + 1 tablespoon) all purpose flour"]}], "steps": [{"section": "", "items": ["In a small pot, melt the butter over medium heat. It will start to crack and sizzle -- let it do this while stirring occasionally. After a few minutes or so, the butter cracking/sizzling will subside and the butter will begin to foam up in the pan.", "Every few seconds or so, swirl the pan around until you can see that the butter is golden brown. You should also be able to see some of the brown bits swirling around in the butter.", "Once golden brown, immediately remove from the heat and pour the butter into a large bowl and put in the fridge to cool for 15-20 minutes.", "Chop your nuts and set aside.", "After butter has cooled, remove the butter from the fridge and add the brown sugar, granulated sugar, and vanilla extract. Whisk to combine.", "Add the egg and sour cream and whisk to combine.", "Add the baking soda, baking powder, cornstarch, and salt, and whisk until incorporated.", "Add the flour and fold it into the mixture using a rubber spatula until there are only a few streaks of flour remaining. Add the chopped nuts and chocolate chips and fold until evenly incorporated and the flour is fully mixed in. DO NOT OVERMIX.", "Cover the bowl tightly and chill the dough for at least 3 hours. Once the three hours is almost up, preheat your oven to 350F and line a baking sheet with parchment paper.", "Scoop the dough using a cookie scoop (I used a 1.5 oz scoop, about 3 tablespoons or 50 grams) and space them 2-3 inches apart on your baking sheet.", "Bake for 10-11 minutes until the edges are set and the centers still look slightly underdone. Let cool on the baking sheet for 10 minutes, then enjoy warm or transfer to a cooling rack to cool completely."]}], "notes": ["Based on this recipe, modified for my taste.", "We need ¾ cup or 170 grams of browned butter. The three extra tablespoons of butter in the recipe should account for the moisture that is evaporated during the browning process. After the butter is browned, make sure you have exactly ¾ cup or 170 grams."], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 8, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "untitled-coconut-recipe": {"title": "Untitled coconut recipe (check title)", "category": "Desserts", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["¼ taza coconut flakes", "1 lata leche de coco 13.5oz", "1 lata crema de coco López", "1 lata leche condensada azucarada", "1 tsp vainilla", "1 taza agua de coco"]}], "steps": [{"section": "", "items": ["Mezclar todos los ingredientes en la licuadora y distribuir mezcla el vasitos de 7oz"]}], "notes": ["Title needs checking: in the original doc this recipe was labeled \"Brown Butter chocolate chip nut cookies\" with the Sturbridge Bakery cookie link (https://sturbridgebakery.com/chewy-brown-butter-chocolate-chip-cookies/), which looks like a copy-paste mistake. The ingredients suggest a coconut drink or limber."], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 9, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "cream-cheese-danishes": {"title": "Cream Cheese Danishes", "category": "Desserts", "source": "", "servings": "", "time": "", "ingredients": [{"section": "Blackberry curd", "items": ["12 ounces blackberries, fresh or frozen", "½ cup granulated sugar (100 grams)", "1 large egg", "2 large egg yolks", "1 tablespoon lemon juice", "2 tablespoons butter (28 grams)"]}, {"section": "Cream cheese filling", "items": ["8 ounces cream cheese, softened at room temperature", "½ cup granulated sugar (100 grams)", "1 large egg yolk", "2 teaspoons vanilla extract"]}, {"section": "Remaining ingredients", "items": ["2 sheets puff pastry, thawed", "1 large egg beaten with 1 tablespoon water (egg wash)", "⅓ cup turbinado sugar (73 grams)", "6 ounces fresh blackberries, for garnish", "powdered sugar, for garnish"]}], "steps": [{"section": "", "items": ["Preheat oven to 400 degrees F. Line two baking sheets with parchment paper.", "Puree blackberries until smooth. Strain seeds and discard. Heat blackberry puree in a medium saucepot over medium heat until simmering. Reduce heat to low and continue to simmer until reduced to ½ cup, about 20 minutes. Remove from heat and let cool.", "Combine ½ cup blackberry puree (130 grams) with sugar, egg, egg yolks, and lemon juice in a medium saucepot. Heat over medium-low heat, stirring constantly. Continue to simmer until curd thickens, about 5 minutes. Remove from heat and add butter, whisking until butter is melted and fully incorporated. Strain curd through a fine-mesh sieve. Set aside and let cool.", "Make cream cheese filling. Beat together cream cheese, sugar, egg yolk, and vanilla until well combined.", "Lightly dust a clean work surface with flour. Roll out puff pastry sheets until you can cut 3 rows of 3 ½-inch circles for a total of 9 portions per sheet. Arrange the puff pastry rounds on the prepared baking sheet.", "Use a fork to prick the center of each round. Fill the center with 1 tablespoon cream cheese filling, making sure to leave a border. Brush the edges with egg wash and sprinkle about 1 teaspoon turbinado sugar on the edges. Bake Danish pastries for 15-18 minutes or until golden brown, rotating the sheet pans halfway through. Remove from oven and let cool completely.", "Fill the center of each pastry with 1 heaping tablespoon blackberry curd. Top with fresh blackberries and dust powdered sugar on top if desired."]}], "notes": ["You can divide the recipe in half to make a smaller batch if desired. Use ½ a large egg for the blackberry curd or make the entire batch and enjoy the extra curd on toast!"], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 10, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "cake-box-cookies-and-cream-cookies": {"title": "Cake box cookies and cream cookies", "category": "Desserts", "source": "https://tasty.co/recipe/cookies-n-cream-cake-mix-cookies", "servings": "12 cookies", "time": "", "ingredients": [{"section": "", "items": ["1 package white cake mix", "12 sandwich cookies, crushed", "⅓ cup oil", "2 eggs"]}], "steps": [{"section": "", "items": ["Combine cake mix, sandwich cookies, oil, and eggs in a mixing bowl.", "Using an ice cream scoop or your hand, form golf ball-sized balls of cookie dough and transfer to a parchment paper-lined baking sheet.", "Let dough rest overnight or at least 2hr.", "Bake at 350°F (180°C) for 10-12 minutes.", "Enjoy!"]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 11, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "cookies-and-cream-cookies": {"title": "Cookies and Cream Cookies", "category": "Desserts", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["1 1/4 cup all-purpose flour", "3/4 cup cake flour", "1 tsp. cornstarch", "1/2 tsp. baking soda", "1/2 tsp. baking powder", "1/2 tsp. salt", "1/2 cup unsalted butter, cold, cut into cubes", "1/2 cup brown sugar, light or dark, packed", "1/4 cup granulated sugar", "1 large egg", "1 large egg yolk", "1 tsp. vanilla extract", "15 Oreo Chocolate Sandwich Cookies (chopped)"]}], "steps": [{"section": "", "items": ["Preheat the oven to 375°F.", "Whisk together the dry ingredients in a large bowl: All-Purpose flour, cake flour, cornstarch, baking soda, baking powder and salt. Set aside.", "Using a stand mixer fitted with the paddle attachment, cream the cold butter with the sugars. Cream for 3-4 minute, it will look sort of like a paste. Scrape down the sides of the mixing bowl as needed.", "Then add in the egg, egg yolk, and vanilla extract and mix again until combined.", "Gradually add in the dry ingredients and then add in the chopped Oreo cookies and cookies.", "Shape dough into 7-large cookies (~5 oz. each). and bake for 10-12 minutes. Or you can make them much smaller and adjust the baking time.", "Let cookies cool on the cookie sheet for 15 minutes and then transfer to a wire cooling rack. ENJOY! ☺️"]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 12, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "red-velvet-cookies": {"title": "Red Velvet Cookies", "category": "Desserts", "source": "https://inbloombakery.com/red-velvet-cookies/", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["1 1/2 cups + 2 tbsps (204 g) all-purpose flour, spooned and leveled", "2 tbsps (10 g) Dutch process cocoa powder", "1/2 tsp baking soda", "1/2 tsp baking powder", "1/2 tsp salt", "3/4 cup (168 g) salted butter, softened", "3/4 cup (165 g) light brown sugar", "1/4 cup (50 g) granulated white sugar", "2 egg yolks, at room temperature", "1 tbsp vanilla", "1-1 1/2 tsp red gel food coloring, (depending on how red you want the cookies)", "3/4 cup (150 g) chopped white chocolate or white chocolate chips"]}], "steps": [{"section": "", "items": ["Preheat oven to 350 degrees. Line two baking sheets with parchment paper and set aside.", "To a small bowl add the flour, cocoa powder, baking soda, baking powder and salt. Whisk to combine then set aside.", "Add softened, salted butter, light brown sugar, and granulated white sugar to a large bowl. Cream the butter and sugars with an electric mixer for two minutes, or until light and fluffy.", "Add in the egg yolks, vanilla and red food coloring and mix on medium speed for two minutes, or until the mixture is fluffy.", "Add in the dry ingredients and mix until combined.", "Then add in the white chocolate and mix just until incorporated.", "Scoop the dough into 18 balls. Arrange the dough two inches apart on the prepared baking sheets.", "Bake the cookies for 10-12 minutes. (Short amount for slightly underdone centers, full amount for a crispier edged cookie).", "Remove from the oven. Let the cookies cool for 5 minutes on the baking sheet, then transfer them to a cooling rack to cool for an additional 5 minutes before eating. (Add extra white chocolate chunks on top after baking if you desire.)", "Store leftovers in an airtight container for up to three days."]}], "notes": ["***Measure your flour properly. This is always my #1 baking tip. Do not ever scoop a measuring cup into your flour. This will always lead to using too much flour. (Trust me, I've learned the hard way that I need to measure properly!) Instead, sprinkle spoonfuls of flour into your measuring cup and swipe excess flour off with the back of a knife. Or better yet, weigh your flour. 1 cup of flour equals 125 grams."], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 13, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "red-velvet-cupcakes": {"title": "Red Velvet Cupcakes", "category": "Desserts", "source": "https://www.biggerbolderbaking.com/red-velvet-cupcakes/", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["1 ¼ cups (6 ¼oz/177g) cake flour (or a little more than 1cup AP flour + 2tbs cornstarch)", "½ teaspoon baking powder", "½ teaspoon baking soda", "½ teaspoon salt", "¾ cup (6oz/170g) sugar", "1 tablespoon (¼ oz/7g) unsweetened cocoa powder", "¼ cup (2oz/57g) butter, softened", "2 tablespoons red food coloring", "1 large egg, at room temperature", "1 teaspoon vanilla extract", "½ cup (4floz/115ml) buttermilk (or ½ cup milk + 1tbsp white vinegar)", "½ teaspoon white vinegar", "½ recipe cream cheese frosting"]}], "steps": [{"section": "Cake", "items": ["Preheat the oven to 350°F (180°C) and line a 12-cup muffin tin with paper liners.", "In the bowl of a stand mixer, or in a large bowl with a handheld mixer, stir together the cake flour, baking powder, baking soda, salt, sugar, and cocoa powder.", "Add the butter, food coloring, and egg to the dry ingredients and blend until fully combined.", "In a small bowl, combine the vanilla, buttermilk, and vinegar together and then gradually whisk into the flour mixture until well combined (but take care not to overmix).", "Divide the batter evenly into the prepared muffin cups. They should be no more than 2/3 of the way full.", "Bake for 20-25 minutes, or until a toothpick inserted into the center comes out clean.", "Let cool in the tin for 10 minutes before removing to a wire rack to fully cool.", "Once the cupcakes are completely cool, you can frost them with Cream Cheese Frosting", "Store these cupcakes in an airtight container in the refrigerator for up to two days. For longer storage, these cupcakes can be frozen in an airtight container for up to two months. Defrost for two hours at room temperature."]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 14, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "cream-cheese-frosting": {"title": "Cream Cheese Frosting", "category": "Desserts", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["5 cups (1 lb 4 oz/ 575g) powdered sugar, sifted lightly to remove any lumps", "2 cups (16oz/454g) cream cheese, at room temperature", "½ cup (4oz/115g) butter, at room temperature", "1 tablespoon vanilla extract"]}], "steps": [{"section": "", "items": ["In a large bowl, using an electric mixer on medium-high cream together the cream cheese and butter.", "Once light and fluffy add in the powdered sugar and vanilla and whip until it is smooth and creamy.", "This can be stored covered in the fridge for up to 4 days."]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 15, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "brownies": {"title": "Brownies", "category": "Desserts", "source": "https://bakerbynature.com/the-best-cocoa-fudge-brownies/", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["1 cup (120g) all-purpose flour", "½ teaspoon baking powder", "½ teaspoon salt", "½ cup (43g) unsweetened cocoa powder", "½ teaspoon espresso powder optional (don't use if you don't like coffee)", "¾ cup (170g) unsalted butter", "2 tablespoons (28ml) oil canola, vegetable, or coconut will work", "1 and 1/3 cups (265g) granulated sugar divided", "2 large eggs", "1 large egg yolk", "2 teaspoons vanilla extract optional, but recommended", "¾ cup (128 grams) chocolate chips"]}], "steps": [{"section": "", "items": ["Preheat oven to 350 degrees (F) (175 degreed C). Line an 9x9-inch baking pan with parchment paper. Spray lightly with non-stick baking spray and set aside.", "In a large bowl, sift together the flour, baking powder, salt, cocoa powder, and espresso powder. Set aside until needed.", "In a medium saucepan, combine the butter, oil, and 1/3 cup of the sugar. Heat over medium heat, stirring frequently, until butter is completely melted. Remove from heat.", "In a large mixing bowl, combine the eggs, egg yolk, vanilla (if using) and remaining sugar. Whisk until well combined, about 30 seconds.", "Slowly, pour the warm butter mixture into the egg mixture, adding it very gradually (a little bit at a time) and whisking constantly until completely combined.", "Add in the dry ingredients and chocolate chips and, using a rubber spatula, slowly stir until just combined. *Do not over mix! Stop stirring when you see the last trace of dry ingredients. Over mixing will give you cakey brownies.", "Scrape the batter into the prepared pan and smooth the top.", "Bake for 28 (to 30 minutes) or until the edges are firm and the top is shiny and slightly cracked.", "Place pan on a cooling rack and cool completely before slicing."]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 16, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "butter-chicken": {"title": "Butter Chicken", "category": "Dinner", "source": "https://www.indianhealthyrecipes.com/butter-chicken/", "servings": "", "time": "", "ingredients": [{"section": "First Marination", "items": ["½ kg (1.1 lbs) boneless chicken (cut to 1 inch pieces)", "½ to ¾ teaspoon Kashmiri red chili powder (or paprika adjust to taste, reduce for kids)", "¼ to ⅓ teaspoon salt (adjust to taste)", "¾ to 1 tablespoon lemon juice"]}, {"section": "Second Marination", "items": ["⅓ cup Greek yogurt (hung curd/thick curd, refer notes)", "¾ tablespoon ginger garlic paste (or ½ tbsp fine grated ginger + ½ tbsp fine grated garlic)", "⅛ teaspoon turmeric (haldi, optional)", "¾ to 1 teaspoon garam masala (adjust to taste)", "½ teaspoon cumin powder (optional)", "1 teaspoon coriander powder (optional)", "1 teaspoon kasuri methi (optional, dried fenugreek leaves)", "¾ to 1 tablespoon oil"]}, {"section": "For sauce", "items": ["2 to 3 tablespoons butter or ghee (divided)", "2 inch cinnamon piece (optional, for extra flavor)", "2 to 4 green cardamoms (optional, for added flavor)", "2 to 4 cloves (optional)", "1½ cups (130 grams) onions sliced (optional, *updated, cuts down acidity from tomatoes)", "600 grams (1.3 lbs.) fresh tomatoes (or 1 cup passata/canned tomato puree or ⅓ cup double concentrate tomato paste - for 1x)", "¾ tablespoon ginger garlic paste (or ½ tbsp each fine grated ginger and garlic)", "1 to 2 green chilies (optional, deseed, slit or chop)", "28 (42 grams, ⅓ cup) whole raw cashews (soaked in hot water, sub with ¼ to ⅓ cup heavy cream)", "½ cup water to blend (more if required)", "1 to 2 teaspoons Kashmiri chili powder (reduce for kids, adjust to taste)", "1 to 1½ teaspoons garam masala (divided, adjust to taste)", "1 to 1½ teaspoon coriander powder (optional, adjust to taste)", "½ teaspoon cumin powder (optional, adjust to taste)", "½ to ¾ teaspoon salt (adjust to taste)", "1 teaspoon sugar (to balance the flavors)", "½ tablespoon Kasuri methi (dried fenugreek leaves)", "1½ cups hot water to make gravy (cut down to 1 cup if omitting cashews)", "⅓ cup (80 to 100 ml) heavy cream or whipping cream (divided)", "2 tablespoons coriander leaves (fine chopped to garnish)"]}], "steps": [{"section": "", "items": ["Marinate chicken with lemon juice, chili powder and salt. Cover and rest for 20 minutes. Next add yogurt, kasuri methi, oil, turmeric, ginger garlic paste, coriander powder, cumin powder and garam masala powder.", "Marinate and rest for a minimum of 30 minutes, or overnight for best results. Cover and refrigerate.", "Optional – If using onion, sauté in 1 tablespoon oil until lightly golden, for 7 minutes. Cool down.", "To a blender, add tomatoes, sautéed onions, cashews and water. Blend to a smooth puree. If you want you can also blend the cashews separately with water to a smooth cream."]}, {"section": "Make the sauce", "items": ["Remove the chicken from the refrigerator, to bring it close to room temperature.", "Melt butter in a pan & add all the whole spices – cinnamon, cloves and cardamoms.", "When they begin to sizzle, stir in the ginger garlic paste & green chilies. Fry on a low heat, for a minute or 2, till it turns fragrant but not burnt.", "Turn off the heat and stir in red chili powder, garam masala, cumin and coriander powder.", "Stir in the tomato cashew puree. If it is not smooth, strain it to the pan.", "Mix well and cover partially. Bring it to a boil on a medium high heat, reduce the heat to low or medium. Cook until the puree turns thick, keep stirring occasionally.", "Pour hot water and simmer for 10 mins, until the sauce thickens & traces of fats are visible on top of the sauce. Remove the whole spices and discard at this stage."]}, {"section": "Grill or roast chicken", "items": ["Spread one tbsp. butter or ghee in a griddle/pan and heat it well. Place the marinated chicken pieces, spacing them a little apart.", "Fry on a medium heat for 2 mins and turn them. Don't burn and do not overcook. Cook till the chicken is just cooked and all the marinade dries up. It is not necessary to fully cook the chicken at this stage.", "This way roast the chicken pieces in 2 to 3 batches, depending on the size of your skillet."]}, {"section": "How to make Butter Chicken", "items": ["Add chicken to the butter chicken gravy. Pour more hot water (about ½ cup, not in the recipe) if the sauce is too thick. Cover and simmer for about 5 to 7 minutes till it becomes tender.", "Stir in salt, sugar and kasuri methi. Taste test and optionally add more garam masala & another tablespoon butter for additional flavour (both are optional).", "Turn off and stir in the heavy cream. Garnish Butter Chicken with chopped coriander leaves and some cream. Serve with Turmeric rice, steamed Basmati Rice, Butter naan or Cumin Rice."]}], "notes": ["Transcribed from screenshots in the original doc."], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 17, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "arroz-con-gandules": {"title": "Arroz con gandules (3lbs)", "category": "Dinner", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["2 latas de gandules", "1 ramo de cilantro", "1 paquete 3 lbs de arroz mediano", "5 cubos de sofrito, approx. 2-2.5 tazas", "1 pimiento rojo", "1.5 latas de salsa tomate goya", "Adobo", "Sal", "Orégano", "1 hoja de laurel"]}], "steps": [], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 18, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "sirloin-steak-with-creamy-mushroom-sauce": {"title": "Sirloin Steak with Creamy Mushroom Sauce", "category": "Dinner", "source": "https://www.youtube.com/watch?v=gy-Zs-q9WW8", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["4 (6-ounce) Certified Angus Beef center cut top sirloin steaks", "2 teaspoons canola oil", "2 teaspoons salt, divided", "1/2 teaspoon pepper", "3 tablespoons butter, divided", "8 ounces mushrooms, sliced", "1 clove garlic, minced", "1 small shallot, minced (optional)", "1/2 cup unsalted beef broth", "3/4 cup heavy cream", "1 teaspoon fresh thyme, chopped"]}], "steps": [{"section": "", "items": ["Preheat oven to 325° F.", "Brush top sirloin steaks evenly with oil and season with 1 1/2 teaspoons salt and 1/2 teaspoon pepper.", "Sear steaks in medium-high skillet 2 to 3 minutes per side; reserve to a sheet pan with a wire rack. Place in oven 15 to 20 minutes, or until steaks reach 125° F internal temperature for medium rare.", "While steaks finish cooking, add 2-tablespoons of butter to the skillet and sautee mushrooms over medium-high heat 2 to 3 minutes", "Add remaining 1-tablespoon butter, garlic and shallots; saut 2 more minutes.", "Stir in beef broth, remaining 1/2-teaspoon salt and heavy cream, bring to a simmer. Lower heat to medium low, simmer 12 minutes to thicken. Sauce should thicken enough to coat the back of a spoon.", "Add fresh thyme and keep warm.", "Allow steaks to rest 5 minutes, serve with warm mushroom cream sauce."]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 19, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "pernil-puertorriqueno": {"title": "Pernil Puertorriqueño (sin piel)", "category": "Dinner", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["2 Pernil, 8 lbs cada uno", "24 dientes de ajo (1.5 por cada libra)", "½ taza Vinagre", "1.5 tsp Pimienta Negra", "1tbsp + 1 tsp Orégano", "Sal (1 tsp por cada libra)"]}], "steps": [{"section": "", "items": ["Mezclar ajo y vinagre en un procesador de alimentos. El vinagre debe cubrir el ajo, pero la medida en los ingredients es la correcta.", "Añadir pimienta negra (verás que el ajo se oscurecerá) y mezclar.", "Añadir oregano y mezclar.", "Cortar ranuras profundas por cada libra de pernil, de 1-2 pulgadas de ancho en ambos lados del pernil.", "Echar 1 tsp de sal en cada ranura. Masajear bien!", "Echar 1 tsp de mezcla de ajo en cada ranura.", "Echar mezcla sobrante por encima del resto del pernil.", "Cubrir con papel de aluminio y dejar marinar por 2 noches", "Cocinar cubierto a 350F por 5-6 horas", "Destapar, echar caldito/grasa derretida por encima del pernil y cocinar descubierto por 7 minutos en broil (high). Monitorear bien que no se queme.", "Remover pernil del horno y remover capa de grasa derretida con un cucharón hasta que mayormente quede el jugo del pernil.", "Cortar pernil a gusto (estofado o en trozos). Ya está listo!"]}], "notes": [], "equipment": ["Envase de aluminio para hornear (17.25 x 13 x 4in)", "Papel de aluminio", "Guantes para adobar (opcional)"], "photoId": "", "photoUrl": "", "favorite": false, "order": 20, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "ensalada-de-coditos": {"title": "Ensalada de coditos", "category": "Dinner", "source": "https://thenoshery.com/ensalada-de-coditos-puerto-rican-macaroni-salad/", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["2-lb elbow macaroni", "1/4 cup olive oil", "1 can spam, small dice", "1 medium onion, grated", "1 cup mayonnaise", "1/4 cup chopped pimento stuffed green olives", "6 hard boiled eggs, diced"]}], "steps": [{"section": "", "items": ["Bring a large pot of salted water to boil. Add the macaroni pasta and whole eggs. Cook until the pasta is al dente, about 11 minutes.", "Transfer the eggs to a bowl with ice and fill with water to cover the eggs, set them aside to cool.", "Drain the pasta in a colander and rinse under cold water to cool the pasta. Transfer the pasta to a large bowl and toss with olive oil.", "Add spam, onion, olives, and mayonnaise to the pasta. Mix until well combined.", "Peel the shell off the eggs and dice. Gently mix in the hard-boiled egg. Cover and refrigerate for 1 hour or overnight."]}], "notes": ["Leaving it to cool in the refrigerator for at least an hour will allow the flavor of the salad to develop."], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 21, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "muslitos-estilo-abuela-zory": {"title": "Muslitos Estilo abuela Zory", "category": "Dinner", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["10 muslitos, sin piel", "10 dientes de ajo (tamaño normal/pequeño, 5-6 si son grandes)", "2 tapitas de vinagre (~2tsp)", "Orégano, a gusto", "Adobo Goya, a gusto", "Aceite de maíz", "½ taza de agua"]}], "steps": [{"section": "", "items": ["Remover piel de los muslitos y lavar con agua.", "Adobar muslitos sin piel con ajo, oregano, vinagre y adobo Goya", "Echar muslitos en un sartén frío y profundo.", "Añadir aceite de maíz y agua. Encender fuege a medio.", "Dejar cocinar a fuege medio/bajo por ~30min (el muslo soltará mucha de su agua. Dejar evaporar el agua haste que se forme una salsita espesa).", "Remover muslos del sartén y reservarlos a un lado.", "Remover caldito/salsita espesa y reservarla en un recipiente aparte de los muslitos.", "A su discreción según cuán sucio o pegado esté los rostros de comida en el sartén, lavar sartén.", "Echar un poco de aceite al sartén y esperar que se caliente, fuego medio-alto.", "Cocinar muslitos en el sartén con aceite hasta que doren.", "Bajar a fuego bajo y añadir salsita reservada."]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 22, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "bacalaitos": {"title": "Bacalaitos", "category": "Dinner", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["Harina", "Agua", "Bacalao", "Perejil"]}], "steps": [{"section": "", "items": ["Enjuagar bacalao", "Cortar en trozos de dos cm y calentar bacalao en agua como por 10min", "Dejar enfriar"]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 23, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "french-onion-soup": {"title": "French Onion Soup", "category": "Dinner", "source": "https://www.recipetineats.com/french-onion-soup/", "servings": "2", "time": "", "ingredients": [{"section": "", "items": ["50 g / 1.75oz unsalted butter", "0.75 kg / 1.25 lb brown / yellow onions, peeled, halved, thinly sliced top to bottom (Note 1)", "1/2 cup (185ml) dry white wine, optional (Note 2)", "1 tbsp flour, plain / all purpose", "0.75 litres / 3 cups / good quality beef broth./stock OR chicken **doesn't have to be unsalted.", "1 dried bay leaf", "2 sprigs fresh thyme", "2tbsp soy sauce", "Salt and pepper"]}], "steps": [{"section": "Caramelise onions (see notes for slow cooker option)", "items": ["Melt butter in a heavy based casserole pot over medium heat. When it starts to foam, add onions and stir to coat in butter.", "30 min on medium low: Turn heat down to medium low. Cook for 30 minutes stirring every few minutes, until the onions have softened and are semi transparent.", "Salt, 20 min on medium high: Turn heat up to medium or medium high. Add salt, and cook for a further 20 -- 30 minutes, stirring more regularly, until onions are deep golden and sweet."]}, {"section": "Make soup", "items": ["Deglaze: Add wine, then simmer rapidly for 2 minutes until mostly evaporated, stirring to scrape the bottom of the pot.", "Flour: Sprinkle flour over the onion and cook for 1 minute.", "Add broth & herbs: Add broth, thyme and bay leaves.", "Simmer: Cover, lower heat so it's simmering gently then simmer for 30 minutes.", "Serve: Season to taste with salt and pepper. Ladle into bowls. Top with 1 or 2 slices of cheesy toast."]}, {"section": "Cheese toast", "items": ["Preheat grill / broiler to high.Toast each side of bread until light golden.", "Top bread with cheese, then grill until melted and some brown spots appear."]}], "notes": ["1. Onions -- halve them then cut from the top to bottom (see video). It makes them hold their shape better when cooking and you don't get stringy bits. But it's not a big deal! Half the onions in the video were accidentally cut the other way.", "2. Wine is used to deglaze the pot here, to get the brown stuff off the base of the pot and also the wine adds flavour into the soup broth. It's fine to skip it -- the beef broth ends up having the same deglazing effect.", "Any non-sweet, non-woody wine is fine. Sauvignon Blanc, Pinot Gris are what I use.", "3. Broth/stock -- French Onion Soup can be made with chicken or beef broth. It is more commonly made with beef stock, from what I have observed.", "Use a good quality beef stock. I personally do not recommend mainstream brands from major supermarkets in Australia. I use Maggie Beer and Moredough from Harris Farms, , or private labels from butchers.", "It is better to use chicken or vegetable broth rather than sub-standard beef broth.", "Best to use low salt and add salt if required.", "4. Bread -- The idea with the recipe is that you can use a spoon to cut through the bread into the soup to eat it (see video). So it's best not to use chewy artisan breads like sourdough. The softer the crumb, the better. Even a thick standard sandwich bread would work!", "5. SLOW COOKER CARAMELISED ONIONS (see recipe video above) -- Read in post for background. Directions: Place onions in slow cooker, toss with 2 tbsp (30g) melted butter. Slow cook on LOW for 10 hours. Onion will be browned but won't have a proper caramelised flavour. Add 2 tbsp (30g) butter into large pot over medium high heat. Tip in all the onions and SOME (not all) of the juices from slow cooker. Cook 10 to 15 minutes until deeply caramelised. Proceed with recipe.", "6. Nutrition per serving, assuming 6 servings"], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 24, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "salsa-verde": {"title": "Salsa Verde", "category": "Dinner", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["8 tomatillos de hoja", "2 chiles serranos", "1/4 de cebolla", "Ajo y sal"]}], "steps": [{"section": "", "items": ["Se pone a coser en agua el tomatillo,chile y la cebolla por 20 minutos a fuego medio", "Después que está listo. Se muele con el ajo y la sal en la licuadora y si quieres es opsional puedes picar cilantro y sevolla y selo pones"]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 25, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "al-pastor": {"title": "Al Pastor", "category": "Dinner", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["5lb puerco", "10 chile guaguillo", "8 ajos medianos", "Clavos 1 tsp", "Pimienta 1tsp", "Cominos 1tsp", "Tomillo1/8 tsp", "Canela entera, la mitad del tamaño de tu uña 💅🏻 pequeña", "sal", "Una tasa de vinagre blanco", "Media Cebolla"]}], "steps": [{"section": "", "items": ["Los chiles se les quita la semillas y el tronco se ponen a coser en agua asta que queden suaves", "Partes la carne en pedazos pequeños", "Después cuando se enfríe el chile le pones todos los condimentos que te dije y se muelen con sal y el vinagre y la agua de los chiles después lo cuelas y lo pones en la carne con sal para la carne lo mezclas y lo dejas marinar por una noche o días", "La mezcla de chile tiene que quedar un poco espesa y aguada no total aguada", "Para cosinar solo lo pones en una casuela y lo dejas que se cueza con su jugo que ace dela carne y el chile asta que se evapore todo y lo pruebas de sal si le falta le pones mas", "En caso de que no sientas que save a condimentos le puedes agregar más pero de los que están molidos", "Si me avisas también se nesesitas se bolla picada en medias lunas para freír y que se caramelice en la casuela donde freíste la carne la sacas y así pones la sevolla a freír con aceite y sal", "Para que te quede así tienes que dejar que se pegue un poco la carne en la casuela y después sacas la carne y la pones la sevolla con el asiente y sal y se fríe", "Si tú chile pinta mucho pole menos chiles"]}], "notes": [], "equipment": [], "photoId": "", "photoUrl": "", "favorite": false, "order": 26, "createdAt": "2026-11-16T00:34:54.473867Z", "updatedAt": "2026-11-16T00:34:54.473867Z"}, "birria": {"title": "Birria", "category": "Dinner", "source": "", "servings": "", "time": "", "ingredients": [{"section": "", "items": ["5 libra de carne de vaca", "3 chiles Nuevo Mexico o Guajillo", "4 tomate", "2 cebolla", "El jugo de una china", "6 dientes de ajo 🧄", "1/4 taza de aceite", "Sal, pimienta, clavos, cominos al gusto", "6 clavos", "2 piscas tomillo", "3 piscas comino", "2 piscas orégano"]}], "steps": [{"section": "", "items": ["Picar y lavar carne, secar con toallas, marinar en bolsa ziploc", "(10-15min sofriendo)", "Fuego medio-alto", "remover semilla y venas del "text": "Shredded pulled chicken or pork", "low": false}, {"text": "Creamy soup (large tub)", "low": false}, {"text": "Titán plantillas (20), Guerrero flour tortillas", "low": false}, {"text": "Porto’s bakery bag, Gamesa cookies", "low": false}]}, {"name": "Fridge: produce", "items": [{"text": "Roma tomatoes, yellow potatoes, garlic, serranos or jalapeños", "low": false}, {"text": "Onions, red onion, iceberg lettuce, avocados, corn husks", "low": false}]}, {"name": "Fridge: condiments and drinks", "items": [{"text": "McCormick mayonesa, Heinz ketchup, Sweet Baby Ray’s, Mae Ploy sweet chili", "low": false}, {"text": "Mezzetta olives, recaito, Tropicana orange juice, Pedialyte-type drink", "low": false}, {"text": "Large jar of sauce or salsa, sauerkraut or cabbage container", "low": false}]}, {"name": "Freezer", "items": [{"text": "Kirkland 88/12 ground beef (about 4 lb, less after the lasagna)", "low": false}, {"text": "Kirkland extra lean ham (24 oz)", "low": false}, {"text": "Chicken breasts (large bag)", "low": false}, {"text": "Perdue panko chicken nuggets", "low": false}, {"text": "Sesame BBQ buns (16)", "low": false}, {"text": "Pepperidge Farm puff pastry (2 sheets)", "low": false}, {"text": "Haagen-Dazs vanilla, Salt & Straw ice cream", "low": false}, {"text": "Frozen lasagna squares (from your batch)", "low": false}]}, {"name": "Appliances and cookware", "items": [{"text": "Instant Pot Duo Plus, Sur la Table air fryer oven, Midea microwave", "low": false}, {"text": "Nutribullet, electric griddle, Kenmore stove", "low": false}, {"text": "Skillets, stainless pots, aluminum lidded pot, two 9-inch square pans", "low": false}]}], "missing": [{"text": "Parmesan"}, {"text": "Cayenne"}, {"text": "Chipotles in adobo"}, {"text": "Fresh ginger"}, {"text": "Turmeric"}, {"text": "Red cooking wine (in cart)"}], "cart": [{"text": "Silk coconut milk"}, {"text": "Lactose-free heavy cream"}, {"text": "Bacon"}, {"text": "Mangos (2)"}, {"text": "Cilantro"}, {"text": "Bananas (5)
