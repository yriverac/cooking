<title>Sazón &amp; Sugar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first. Phone = single column + bottom tab bar (kitchen & store). Tablet/hub = two columns. Laptop = top nav, recipe sheet with sticky ingredients. */
:root{
  --bg:#F7EBEE; --surface:#FFFFFF; --soft:#FBF3F5; --rose:#EBCBD4; --rose-2:#E2B6C3;
  --ink:#3B2330; --muted:#76606C; --line:#EAD4DB; --accent:#8C4760; --accent-ink:#FFFFFF;
  --leaf:#46663A; --leaf-soft:#E4EEDC; --warn:#A8461F; --warn-soft:#FBE6DC; --alert:#B42318; --alert-soft:#FDE4E1;
  --t-drinks:#F1D3DB; --t-app:#EFDCC9; --t-dess:#F4C9D3; --t-dinner:#DCC6D2; --t-other:#E6D6E4;
  --shadow:0 1px 2px rgba(59,35,48,.06),0 8px 24px rgba(59,35,48,.07);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1317; --surface:#271B21; --soft:#2F2128; --rose:#4A3039; --rose-2:#5A3946;
  --ink:#F5E6EB; --muted:#BFA5B1; --line:#3D2A33; --accent:#E59AB3; --accent-ink:#2A141D;
  --leaf:#A9C78F; --leaf-soft:#26321F; --warn:#F0A07E; --warn-soft:#3A2419; --alert:#FF9C8F; --alert-soft:#3D1D1A;
  --t-drinks:#4A2D37; --t-app:#46362B; --t-dess:#512C38; --t-dinner:#3C2C36; --t-other:#3A2E3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1317; --surface:#271B21; --soft:#2F2128; --rose:#4A3039; --rose-2:#5A3946;
  --ink:#F5E6EB; --muted:#BFA5B1; --line:#3D2A33; --accent:#E59AB3; --accent-ink:#2A141D;
  --leaf:#A9C78F; --leaf-soft:#26321F; --warn:#F0A07E; --warn-soft:#3A2419; --alert:#FF9C8F; --alert-soft:#3D1D1A;
  --t-drinks:#4A2D37; --t-app:#46362B; --t-dess:#512C38; --t-dinner:#3C2C36; --t-other:#3A2E3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.it{font-family:var(--display);font-style:italic;color:var(--accent);font-weight:500}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--rose-2);border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--soft);border-color:var(--line);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px;min-height:34px}
.btn.danger{background:var(--alert);border-color:var(--alert);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none;padding:0}
.iconbtn svg{width:18px;height:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--rose);color:var(--ink);white-space:nowrap}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.alert{background:var(--alert-soft);color:var(--alert)}
.chip.line{background:transparent;border:1px solid var(--line);color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner b{display:block}
.banner.alert{background:var(--alert-soft);color:var(--alert)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--soft);border:1px solid var(--line)}
.banner ul{margin:4px 0 0;padding-left:18px}
.empty{background:var(--surface);border:1px dashed var(--rose-2);border-radius:var(--r);padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{font-size:21px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-block:22px 12px;flex-wrap:wrap}

/* header + tabs */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-size:22px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap;margin-right:auto}
nav.desk{display:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));height:calc(var(--tabh) + env(safe-area-inset-bottom,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--soft)}
#sync{font-size:12px;color:var(--muted)}

/* home */
.hero{padding-block:22px 6px}
.hero h1{font-size:32px}
.search{position:relative;margin-top:14px}
.search input{border-radius:999px;padding:12px 16px 12px 42px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.thumb{aspect-ratio:4/3;width:100%;max-width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .initial{font-family:var(--display);font-style:italic;font-size:44px;color:var(--accent);opacity:.85}
.thumb .badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
.card .meta{padding:10px 12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .meta .label{font-size:10px;color:var(--accent)}
.card h3{font-size:16px}
.card .sub{font-size:12px;color:var(--muted)}

/* recipe */
.recipe{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 40px}
.rhead{display:grid;gap:14px}
.rhead .thumb{border-radius:var(--r)}
.rhead h1{font-size:30px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.facts div{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.facts b{font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.stepper button{width:36px;height:36px;border:0;border-radius:999px;background:var(--surface);font-size:20px;line-height:1;font-weight:600}
.stepper output{min-width:96px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.sec-title{margin:14px 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
ul.checks{list-style:none;margin:0;padding:0}
ul.checks li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
ul.checks li:last-child{border-bottom:0}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--rose-2);display:grid;place-items:center;margin-top:-1px}
li.done .box{background:var(--accent);border-color:var(--accent)}
li.done .box::after{content:"";width:10px;height:5px;border:2.5px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
li.done .txt{text-decoration:line-through;color:var(--muted)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.qty{font-weight:700}
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
ol.steps li .n{font-family:var(--display);font-style:italic;font-size:24px;color:var(--accent);line-height:1}
ol.steps li.done{color:var(--muted)}
ol.steps li.done .n::after{content:" ✓";font-style:normal;font-size:14px}
.timer-chip{display:inline-flex;align-items:center;gap:6px;margin:8px 6px 0 0;border:1px solid var(--rose-2);background:var(--soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.notes{white-space:pre-wrap}
.srcbox{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:12px;padding:10px 12px}

/* editor */
.editor{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;max-width:880px;margin:0 auto}
.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600}
.full{grid-column:1/-1}
.sec-edit{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.ing-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:6px;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ing-row>:nth-child(3){grid-column:1/-1;grid-row:2}
.ing-row:last-child{border-bottom:0}
.ing-row .tools{display:flex;gap:2px}
.ing-row .tools .iconbtn{width:32px;height:32px}
.step-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px;align-items:start}
.step-row .n{padding-top:10px;color:var(--muted);font-size:13px;text-align:right}
.step-row .tools{display:flex;flex-direction:column;gap:2px}
.step-row .tools .iconbtn{width:32px;height:32px}
.photo-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-pick .thumb{width:140px;border-radius:12px}
.pastezone{border:2px dashed var(--rose-2);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:14px;font-weight:600;background:var(--surface);cursor:text;caret-color:transparent;min-height:52px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:10px}
.pastezone:focus{outline:none;border-color:var(--accent);background:var(--soft);color:var(--accent)}
.pastezone.over{border-color:var(--accent);background:var(--soft)}
.pastezone.busy{color:var(--leaf);border-color:var(--leaf)}
.pastezone.err{color:var(--alert);border-color:var(--alert)}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shot{position:relative;margin:0;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--soft)}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .iconbtn{position:absolute;top:4px;right:4px;width:26px;height:26px}
.shot .iconbtn svg{width:14px;height:14px}
.sticky-save{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;z-index:5}
.howto{display:grid;gap:8px}
.howto div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px}
.howto b{font-family:var(--display);font-style:italic;color:var(--accent);font-size:20px;line-height:1}

/* plan / prep / shop / kitchen */
.weeknav{display:flex;gap:8px;align-items:center}
.weeknav b{font-family:var(--display);font-size:18px}
.day{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid transparent}
.day.today{border-color:var(--accent)}
.day h3{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.pl{background:var(--soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pl a{color:var(--ink);text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.pl .row{gap:6px}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.mode button{border:0;background:none;padding:4px 10px;font-size:12px;font-weight:700}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mini-step{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.mini-step button{border:0;background:none;width:28px;height:28px;font-weight:700}
.mini-step span{font-size:12px;font-weight:700;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.shop-sec{margin-top:6px}
.shop-sec h3{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);padding:12px 0 2px;display:flex;justify-content:space-between}
.shop li{min-height:56px;align-items:center}
.shop li .box{width:28px;height:28px}
.shop .from{display:block;font-size:12px;color:var(--muted)}
details.have{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--soft)}
details.have summary{cursor:pointer;font-weight:600}
.inv-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.inv-row:last-child{border-bottom:0}
.inv-row .nm{font-weight:600;overflow-wrap:anywhere}
.inv-row .qt{font-size:13px;color:var(--muted)}
.inv-row .act{display:flex;gap:4px;align-items:center}
.inv-row .act button{border:0;background:none;color:var(--muted);font-size:13px;padding:6px;border-radius:8px}
.inv-row.expired .nm{color:var(--alert)}
.inv-edit{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding-top:6px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:4px}
.seg::-webkit-scrollbar{display:none}
.sug{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:12px;padding:10px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.sug .thumb{width:60px;border-radius:8px;flex:none}
.sug .thumb .initial{font-size:26px}
.meter{height:6px;border-radius:999px;background:var(--rose);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--leaf)}
.prep-group{display:flex;flex-direction:column;gap:2px}
.prep-group h3{display:flex;gap:10px;align-items:baseline}
.prep-group h3 .k{font-family:var(--display);font-style:italic;color:var(--accent);font-size:24px}
.who{font-size:12px;color:var(--muted);display:block}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(30,15,22,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:18px 18px 0 0;width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.modal header{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .body{overflow:auto;padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.pick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:6px}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.pick .thumb{width:52px;border-radius:8px;flex:none}
.pick .thumb .initial{font-size:22px}

/* cook mode */
.cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.cook-top{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.cook-top .ttl{flex:1;min-width:0}
.cook-top .ttl div{font-family:var(--display);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--rose)} .bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.cook-body{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr)}
.cook-step{padding:24px max(18px,env(safe-area-inset-left,0px)) 20px max(18px,env(safe-area-inset-right,0px));max-width:900px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.cook-step .num{font-family:var(--display);font-style:italic;color:var(--accent);font-size:20px}
.cook-step .ctext{font-size:clamp(24px,4.4vw,44px);line-height:1.35;font-weight:500}
.cook-step .kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf);font-weight:700}
.cook-ings{background:var(--surface);border-top:1px solid var(--line);padding:16px}
.cook-foot{display:flex;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.cook-foot .btn{flex:1;padding:16px;font-size:17px;min-height:56px}
.awake{font-size:12px;color:var(--leaf);font-weight:600}

/* timers + toast */
.timers{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + 12px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
body.cooking .timers{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.timer{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.timer b{font-variant-numeric:tabular-nums;font-size:22px;font-family:var(--display)}
.timer small{display:block;font-size:11px;opacity:.8;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:0;background:rgba(127,127,127,.25);color:inherit;border-radius:999px;width:34px;height:34px}
.timer.ring{background:var(--accent);color:var(--accent-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;max-width:calc(100% - 32px);text-align:center}

/* tablet / kitchen hub */
@media (min-width:700px){
  h1{font-size:38px} .hero h1{font-size:42px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
  .card h3{font-size:18px}
  .thumb .initial{font-size:60px}
  .rhead{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:24px}
  .rhead h1{font-size:40px}
  .fieldgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ing-row{grid-template-columns:72px 90px minmax(0,1fr) auto;border-bottom:0;padding-bottom:0}
  .ing-row>:nth-child(3){grid-column:auto;grid-row:auto}
  .fieldgrid .half{grid-column:span 2}
  .howto{grid-template-columns:repeat(3,1fr)}
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .scrim{align-items:center;padding:16px}
  .modal{border-radius:18px}
  .cook-body{grid-template-columns:minmax(0,1fr) 340px}
  .cook-ings{border-top:0;border-left:1px solid var(--line);overflow:auto}
  .filters,.seg{margin-inline:0;padding-inline:0;flex-wrap:wrap;overflow:visible}
}
/* laptop */
@media (min-width:1000px){
  body{padding-bottom:0}
  nav.tabs{display:none}
  nav.desk{display:flex;gap:2px}
  nav.desk a{text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;padding:8px 12px;border-radius:999px}
  nav.desk a[aria-current="page"]{background:var(--rose)}
  header.top .wrap{padding-block:14px}
  .brand{font-size:26px}
  .recipe{grid-template-columns:minmax(0,1fr) 380px;gap:28px;padding-block:28px 60px}
  .rhead{grid-column:1/-1}
  .side{position:sticky;top:90px;align-self:start;max-height:calc(100vh - 110px);overflow:auto}
  .days{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sticky-save{bottom:0}
  .timers{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

ke", "items": [{"q": 2.5, "q2": null, "u": "cups", "n": "all purpose flour, spooned and leveled"}, {"q": 3, "q2": null, "u": "teaspoons", "n": "baking powder"}, {"q": 0.5, "q2": null, "u": "teaspoon", "n": "salt"}, {"q": 1.75, "q2": null, "u": "cups", "n": "granulated sugar"}, {"q": 0.5, "q2": null, "u": "cup", "n": "vegetable or canola oil"}, {"q": 2, "q2": null, "u": "", "n": "large eggs, room temperature"}, {"q": 2, "q2": null, "u": "", "n": "large egg whites, room temperature"}, {"q": 2.5, "q2": null, "u": "teaspoons", "n": "pure vanilla extract"}, {"q": 0.5, "q2": null, "u": "teaspoon", "n": "almond extract, optional, but highly recommended"}, {"q": 0.6666666666666666, "q2": null, "u": "cup", "n": "sour cream"}, {"q": 0.75, "q2": null, "u": "cup", "n": "milk, preferably whole or 2%, room temperature"}]}, {"section": "Filling", "items": [{"q": 3, "q2": null, "u": "cups", "n": "sliced or diced fresh strawberries, divided"}, {"q": 2, "q2": null, "u": "tablespoons", "n": "strawberry jam"}, {"q": null, "q2": null, "u": "", "n": "additional whole strawberries, for garnish, optional"}]}, {"section": "Frosting", "items": [{"q": 8, "q2": null, "u": "ounces", "n": "cream cheese, softened to cool room temp"}, {"q": 1, "q2": null, "u": "cup", "n": "powdered sugar"}, {"q": 0.75, "q2": null, "u": "teaspoon", "n": "vanilla extract"}, {"q": 2.25, "q2": null, "u": "cups", "n": "heavy whipping cream, really cold, straight from the fridge"}]}], "steps": [{"section": "Cake", "items": ["Preheat oven to 350°F.", "In a medium bowl, whisk flour, baking powder, and salt until combined. Set aside.", "Using a stand mixer fitted with the paddle attachment (preferred) or a hand mixer, beat sugar, oil, eggs, egg whites, and extracts until combined. Add the sour cream and beat until combined. Add half of the flour mixture, beating until just combined. While still beating, slowly add milk, then the remaining flour mixture. Scrape the sides and bottom of the bowl as needed. Be careful not to overmix it.", "Line three 8-inch cake pans** with parchment paper and grease the pans. Evenly divide the batter between the three pans. Tap/gently drop the pans on the countertop a couple times to remove any air bubbles.", "Bake for 18-22 minutes, until a toothpick inserted into the center comes out clean. If necessary, rotate the pans once during bake time to ensure even browning. Place the pans on a rack to cool completely."]}, {"section": "Filling", "items": ["Combine the strawberries and jam and set aside (these will be used for the filling and topping). Note: I slice the strawberries for the filling (about 2½ cups), and I diced the strawberries for the top of the cake (about ½ cup). You can slice or dice, your choice. You'll need about 3 cups total."]}, {"section": "Frosting", "items": ["Place the cream cheese, powdered sugar, and vanilla extract in a large mixing bowl. Using a stand mixer with a whisk attachment (preferred) or hand mixer, beat the mixture on medium speed until smooth. While the mixer is still whipping, slowly pour the heavy cream down the side of the bowl. Stop and scrape the bottom and sides of the bowl periodically. Increase the speed to high and continue whipping until the cream can hold a stiff peak. It is important that the cream stays cold so that it will thicken properly. If you're using a hand mixer hold the bowl near the top and don't hold the bowl against your body."]}, {"section": "Assembly", "items": ["Place one layer of cake on a platter. Top with one-third of the frosting, then top with about 1¼ cups of strawberries. Place another layer of cake on top and repeat. For the third/top of layer of cake, top with remaining whipped cream frosting, then place the remaining strawberries in the center. Decorate the outside with whole strawberries, if desired."]}], "notes": "**CAKE PANS: Using three cake pans produces cake layers that are on the thinner side (my preference for filling and stacking). If you'd prefer the cake layers thicker, or you do not have three 8-inch round cake pans, you can divide the batter between two 8-inch cake pans. Increase the bake time to 22-27 minutes.\n\nPrefer a 9x13? That recipe is here: Strawberry Shortcake Sheet Cake (https://celebratingsweets.com/strawberry-shortcake-sheet-cake/).\n\nEGGS AND MILK: To quickly bring eggs and milk to room temperature place the four eggs in a bowl of really warm tap water for about 5 minutes. Microwave the milk to take the chill off, about 15 seconds.\n\nFROSTING: This frosting is stabilized with cream cheese, so it tastes like a cheesecake whipped cream. If you don't want the flavor of cream cheese you can use 8-oz of mascarpone cheese instead. Just be aware that the frosting will be softer than if you use cream cheese. Alternatively, you can use vanilla buttercream frosting (https://celebratingsweets.com/vanilla-buttercream-frosting/) or freshly whipped cream (https://celebratingsweets.com/easy-homemade-whipped-cream-10-flavors/). Note: the homemade whipped cream will not be as stable, so you'll want to assemble it right before serving.\n\nSTORING: This cake is best served the day it is made. After assembly, refrigerate the cake, then bring to cool room temperature before serving.\n\nMAKE AHEAD: This cake is best the day it is made. If you have to make it ahead, you can prepare the following one day in advance. Note: do not assemble until the day you are serving. Bake and cool the cake layers and wrap in wax paper and plastic wrap and store in the refrigerator. Prepare the whipped cream frosting and store it in the refrigerator. The frosting may deflate as it sits for an extended time so you might need to re-whip it before assembling. Hold off on tossing the strawberries with jam until you are assembling the cake. Store assembled cake in the refrigerator and bring to cool room temperature before serving", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 5, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "banana-chocolate-chip-muffins": {"schema": 2, "title": "Banana Chocolate Chip Muffins", "category": "Desserts", "source": "", "servings": 12, "servingsUnit": "muffins", "prepMin": null, "cookMin": null, "cuisine": "American", "protein": "", "freezer": true, "fridgeDays": 4, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 1.6666666666666665, "q2": null, "u": "cups", "n": "all-purpose flour, spooned into measuring cup and leveled-off"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "baking powder"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "baking soda"}, {"q": 0.5, "q2": null, "u": "teaspoon", "n": "salt"}, {"q": 0.5, "q2": null, "u": "cup", "n": "(1 stick) unsalted butter, at room temperature"}, {"q": 0.75, "q2": null, "u": "cup", "n": "plus 2 tablespoons sugar"}, {"q": 2, "q2": null, "u": "", "n": "large eggs"}, {"q": 1, "q2": null, "u": "cup", "n": "mashed bananas, from 2 to 3 overripe bananas"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "vanilla extract"}, {"q": 0.3333333333333333, "q2": null, "u": "cup", "n": "sour cream or plain Greek yogurt (low-fat is fine)"}, {"q": 0.5, "q2": null, "u": "cup", "n": "semi-sweet chocolate chips"}, {"q": 0.5, "q2": null, "u": "cup", "n": "chopped walnuts"}]}], "steps": [{"section": "", "items": ["Preheat the oven to 350°F (175°C) and set an oven rack in the middle position. Line a 12-cup muffin tin with paper liners.", "In a medium bowl, whisk together the flour, baking powder, baking soda, and salt. Set aside.", "In the bowl of an electric mixer, beat the butter and sugar on medium-high speed until fluffy, about 2 minutes. Scrape down the sides of the bowl with a rubber spatula.", "At medium speed, add the eggs one at a time, beating until fully incorporated between additions.", "Add the mashed bananas, vanilla, and sour cream (or Greek yogurt) and beat until blended (the batter will look a bit curdled; that's okay).", "Add the dry ingredients and mix on low speed until well blended.", "On low speed, mix in chocolate chips and nuts evenly into the batter.", "Spoon the batter into the prepared muffin tin (the cups will be very full) and sprinkle evenly with the reserved chocolate chips. Bake the muffins until the tops are golden and domed, 23 to 25 minutes. Let the muffins cool in the pan for 10 minutes, then turn them out onto a rack and let cool for at least 10 minutes before serving. The muffins are best fresh out of the oven but will keep for up to 4 days stored in a sealed container or resealable plastic bag, in a single layer (to prevent the muffins from getting soggy, line the top and bottom of the container or bag with a single layer of paper towels)."]}], "notes": "By Jennifer Segal (https://www.onceuponachef.com/about-jenn-segal)\n\nPrep Time: 20 minutes\n\nCook Time: 25 minutes\n\nTotal Time: 45 minutes", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": [], "order": 6, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "brown-butter-chocolate-chip-nut-cookies-instagram": {"schema": 2, "title": "Brown Butter Chocolate Chip Nut Cookies (Instagram version)", "category": "Desserts", "source": "https://www.instagram.com/p/DcJKsIoRepC/", "servings": null, "servingsUnit": "servings", "prepMin": 30, "cookMin": 12, "cuisine": "American", "protein": "", "freezer": true, "fridgeDays": 5, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 293, "q2": null, "u": "g", "n": "all-purpose flour"}, {"q": 190, "q2": null, "u": "g", "n": "dark brown sugar"}, {"q": 90, "q2": null, "u": "g", "n": "granulated sugar"}, {"q": 2, "q2": null, "u": "sticks", "n": "salted butter"}, {"q": 1, "q2": null, "u": "", "n": "large egg + 1 egg yolk"}, {"q": 2, "q2": null, "u": "tbsp", "n": "milk"}, {"q": 2, "q2": null, "u": "tsp", "n": "vanilla extract"}, {"q": 1, "q2": null, "u": "tsp", "n": "salt"}, {"q": 0.75, "q2": null, "u": "tsp", "n": "baking soda"}, {"q": 0.25, "q2": null, "u": "tsp", "n": "baking powder"}, {"q": 80, "q2": null, "u": "g", "n": "crushed walnuts"}, {"q": 60, "q2": null, "u": "g", "n": "chocolate chips"}, {"q": null, "q2": null, "u": "", "n": "Toffee (traders joes, store bought, or homemade)"}]}], "steps": [{"section": "Brown the butter", "items": ["Place 227 g salted butter in a light-colored saucepan over medium heat.", "Melt completely, stirring/swirl occasionally. Continue cooking as it foams and bubbles.", "Once the milk solids turn deep golden brown and smell nutty/caramel-like, immediately remove from heat. DO NOT LET BURN.", "Pour into a metal mixing bowl, making sure to scrape in all the browned milk solids.", "Allow the butter to cool until it is no longer hot."]}, {"section": "Prepare the dry ingredients", "items": ["While the butter cools, combine in a separate bowl: 293 g flour, 1 tsp salt, ¾ tsp baking soda, ¼ tsp baking powder.", "Mix thoroughly and set aside."]}, {"section": "Prepare the wet mixture", "items": ["Combine 190 g dark brown sugar + 90 g granulated sugar.", "Mix until evenly distributed.", "Once the browned butter has cooled, add the sugar mixture to the butter.", "Mix thoroughly with a spatula until combined. To avoid overmixing, never use whisk or stand/hand mixer.", "Add 2 tsp vanilla, 1 whole egg, 1 egg yolk, 30 g milk, and mix with the spatula until the mixture is cohesive and the egg is fully incorporated."]}, {"section": "Add the dry ingredients", "items": ["Add half of the flour mixture.", "Fold with the spatula until partially incorporated. DO NOT mix until completely smooth. Allow clumps of flour to remain visible.", "Add the remaining flour mixture.", "Fold until mostly incorporated, leaving only a several CLUMPS of flour.", "Add walnuts and chocolate and mix until fully inforporated, leaving only some streaks of flour. Stop mixing as soon as there are no streaks of dry flour. Don't overmix."]}, {"section": "Refrigerate the dough", "items": ["Cover the bowl tightly.", "Refrigerate for at least 3 hours.", "For the best flavor and texture, refrigerate overnight."]}], "notes": "Based on this recipe, modified for my taste.", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts.", "No amount for: Toffee (traders joes, store bought, or homemade)"], "order": 7, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "brown-butter-chocolate-chip-nut-cookies": {"schema": 2, "title": "Brown Butter chocolate chip nut cookies", "category": "Desserts", "source": "https://sturbridgebakery.com/chewy-brown-butter-chocolate-chip-cookies/", "servings": null, "servingsUnit": "servings", "prepMin": 30, "cookMin": 11, "cuisine": "American", "protein": "", "freezer": true, "fridgeDays": 5, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 35, "q2": null, "u": "grams", "n": "mini morsels of semi-sweet chocolate"}, {"q": 60, "q2": null, "u": "g", "n": "cup chopped nuts (walnuts and/or pecans)"}, {"q": 211, "q2": null, "u": "grams", "n": "(15 tablespoons) unsalted butter (European style is preferred!), browned to 170 grams or 3/4 cup*"}, {"q": 150, "q2": null, "u": "grams", "n": "(3/4 cup) light brown sugar"}, {"q": 50, "q2": null, "u": "grams", "n": "(¼ cup) granulated sugar"}, {"q": 0.5, "q2": null, "u": "tablespoon", "n": "vanilla extract"}, {"q": 1, "q2": null, "u": "", "n": "egg, room temperature"}, {"q": 20, "q2": null, "u": "grams", "n": "(1 heaping tablespoon) sour cream, room temperature"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "baking soda"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "baking powder"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "cornstarch"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "fine sea salt"}, {"q": 225, "q2": null, "u": "grams", "n": "(about 1 3/4 cups + 1 tablespoon) all purpose flour"}]}], "steps": [{"section": "", "items": ["In a small pot, melt the butter over medium heat. It will start to crack and sizzle -- let it do this while stirring occasionally. After a few minutes or so, the butter cracking/sizzling will subside and the butter will begin to foam up in the pan.", "Every few seconds or so, swirl the pan around until you can see that the butter is golden brown. You should also be able to see some of the brown bits swirling around in the butter.", "Once golden brown, immediately remove from the heat and pour the butter into a large bowl and put in the fridge to cool for 15-20 minutes.", "Chop your nuts and set aside.", "After butter has cooled, remove the butter from the fridge and add the brown sugar, granulated sugar, and vanilla extract. Whisk to combine.", "Add the egg and sour cream and whisk to combine.", "Add the baking soda, baking powder, cornstarch, and salt, and whisk until incorporated.", "Add the flour and fold it into the mixture using a rubber spatula until there are only a few streaks of flour remaining. Add the chopped nuts and chocolate chips and fold until evenly incorporated and the flour is fully mixed in. DO NOT OVERMIX.", "Cover the bowl tightly and chill the dough for at least 3 hours. Once the three hours is almost up, preheat your oven to 350F and line a baking sheet with parchment paper.", "Scoop the dough using a cookie scoop (I used a 1.5 oz scoop, about 3 tablespoons or 50 grams) and space them 2-3 inches apart on your baking sheet.", "Bake for 10-11 minutes until the edges are set and the centers still look slightly underdone. Let cool on the baking sheet for 10 minutes, then enjoy warm or transfer to a cooling rack to cool completely."]}], "notes": "Based on this recipe, modified for my taste.\n\nWe need ¾ cup or 170 grams of browned butter. The three extra tablespoons of butter in the recipe should account for the moisture that is evaporated during the browning process. After the butter is browned, make sure you have exactly ¾ cup or 170 grams.", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 8, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "untitled-coconut-recipe": {"schema": 2, "title": "Untitled coconut recipe (check title)", "category": "Desserts", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": 10, "cookMin": 0, "cuisine": "Puerto Rican", "protein": "", "freezer": true, "fridgeDays": 5, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 0.25, "q2": null, "u": "taza", "n": "coconut flakes"}, {"q": 1, "q2": null, "u": "lata", "n": "leche de coco 13.5oz"}, {"q": 1, "q2": null, "u": "lata", "n": "crema de coco López"}, {"q": 1, "q2": null, "u": "lata", "n": "leche condensada azucarada"}, {"q": 1, "q2": null, "u": "tsp", "n": "vainilla"}, {"q": 1, "q2": null, "u": "taza", "n": "agua de coco"}]}], "steps": [{"section": "", "items": ["Mezclar todos los ingredientes en la licuadora y distribuir mezcla el vasitos de 7oz"]}], "notes": "Title needs checking: in the original doc this recipe was labeled \"Brown Butter chocolate chip nut cookies\" with the Sturbridge Bakery cookie link (https://sturbridgebakery.com/chewy-brown-butter-chocolate-chip-cookies/), which looks like a copy-paste mistake. The ingredients suggest a coconut drink or limber.", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts.", "The doc titled this as a cookie recipe, but the ingredients are a coconut drink or dessert. Give it the right name."], "order": 9, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "cream-cheese-danishes": {"schema": 2, "title": "Cream Cheese Danishes", "category": "Desserts", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": 40, "cookMin": 18, "cuisine": "American", "protein": "", "freezer": false, "fridgeDays": 3, "freezerMonths": 0, "tags": [], "ingredients": [{"section": "Blackberry curd", "items": [{"q": 12, "q2": null, "u": "ounces", "n": "blackberries, fresh or frozen"}, {"q": 0.5, "q2": null, "u": "cup", "n": "granulated sugar (100 grams)"}, {"q": 1, "q2": null, "u": "", "n": "large egg"}, {"q": 2, "q2": null, "u": "", "n": "large egg yolks"}, {"q": 1, "q2": null, "u": "tablespoon", "n": "lemon juice"}, {"q": 2, "q2": null, "u": "tablespoons", "n": "butter (28 grams)"}]}, {"section": "Cream cheese filling", "items": [{"q": 8, "q2": null, "u": "ounces", "n": "cream cheese, softened at room temperature"}, {"q": 0.5, "q2": null, "u": "cup", "n": "granulated sugar (100 grams)"}, {"q": 1, "q2": null, "u": "", "n": "large egg yolk"}, {"q": 2, "q2": null, "u": "teaspoons", "n": "vanilla extract"}]}, {"section": "Remaining ingredients", "items": [{"q": 2, "q2": null, "u": "sheets", "n": "puff pastry, thawed"}, {"q": 1, "q2": null, "u": "", "n": "large egg beaten with 1 tablespoon water (egg wash)"}, {"q": 0.3333333333333333, "q2": null, "u": "cup", "n": "turbinado sugar (73 grams)"}, {"q": 6, "q2": null, "u": "ounces", "n": "fresh blackberries, for garnish"}, {"q": null, "q2": null, "u": "", "n": "powdered sugar, for garnish"}]}], "steps": [{"section": "", "items": ["Preheat oven to 400 degrees F. Line two baking sheets with parchment paper.", "Puree blackberries until smooth. Strain seeds and discard. Heat blackberry puree in a medium saucepot over medium heat until simmering. Reduce heat to low and continue to simmer until reduced to ½ cup, about 20 minutes. Remove from heat and let cool.", "Combine ½ cup blackberry puree (130 grams) with sugar, egg, egg yolks, and lemon juice in a medium saucepot. Heat over medium-low heat, stirring constantly. Continue to simmer until curd thickens, about 5 minutes. Remove from heat and add butter, whisking until butter is melted and fully incorporated. Strain curd through a fine-mesh sieve. Set aside and let cool.", "Make cream cheese filling. Beat together cream cheese, sugar, egg yolk, and vanilla until well combined.", "Lightly dust a clean work surface with flour. Roll out puff pastry sheets until you can cut 3 rows of 3 ½-inch circles for a total of 9 portions per sheet. Arrange the puff pastry rounds on the prepared baking sheet.", "Use a fork to prick the center of each round. Fill the center with 1 tablespoon cream cheese filling, making sure to leave a border. Brush the edges with egg wash and sprinkle about 1 teaspoon turbinado sugar on the edges. Bake Danish pastries for 15-18 minutes or until golden brown, rotating the sheet pans halfway through. Remove from oven and let cool completely.", "Fill the center of each pastry with 1 heaping tablespoon blackberry curd. Top with fresh blackberries and dust powdered sugar on top if desired."]}], "notes": "You can divide the recipe in half to make a smaller batch if desired. Use ½ a large egg for the blackberry curd or make the entire batch and enjoy the extra curd on toast!", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 10, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "cake-box-cookies-and-cream-cookies": {"schema": 2, "title": "Cake box cookies and cream cookies", "category": "Desserts", "source": "https://tasty.co/recipe/cookies-n-cream-cake-mix-cookies", "servings": 12, "servingsUnit": "cookies", "prepMin": 10, "cookMin": 12, "cuisine": "American", "protein": "", "freezer": true, "fridgeDays": 5, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 1, "q2": null, "u": "package", "n": "white cake mix"}, {"q": 12, "q2": null, "u": "", "n": "sandwich cookies, crushed"}, {"q": 0.3333333333333333, "q2": null, "u": "cup", "n": "oil"}, {"q": 2, "q2": null, "u": "", "n": "eggs"}]}], "steps": [{"section": "", "items": ["Combine cake mix, sandwich cookies, oil, and eggs in a mixing bowl.", "Using an ice cream scoop or your hand, form golf ball-sized balls of cookie dough and transfer to a parchment paper-lined baking sheet.", "Let dough rest overnight or at least 2hr.", "Bake at 350°F (180°C) for 10-12 minutes.", "Enjoy!"]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": [], "order": 11, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "cookies-and-cream-cookies": {"schema": 2, "title": "Cookies and Cream Cookies", "category": "Desserts", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": 20, "cookMin": 12, "cuisine": "American", "protein": "", "freezer": true, "fridgeDays": 5, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 1.25, "q2": null, "u": "cup", "n": "all-purpose flour"}, {"q": 0.75, "q2": null, "u": "cup", "n": "cake flour"}, {"q": 1, "q2": null, "u": "tsp", "n": "cornstarch"}, {"q": 0.5, "q2": null, "u": "tsp", "n": "baking soda"}, {"q": 0.5, "q2": null, "u": "tsp", "n": "baking powder"}, {"q": 0.5, "q2": null, "u": "tsp", "n": "salt"}, {"q": 0.5, "q2": null, "u": "cup", "n": "unsalted butter, cold, cut into cubes"}, {"q": 0.5, "q2": null, "u": "cup", "n": "brown sugar, light or dark, packed"}, {"q": 0.25, "q2": null, "u": "cup", "n": "granulated sugar"}, {"q": 1, "q2": null, "u": "", "n": "large egg"}, {"q": 1, "q2": null, "u": "", "n": "large egg yolk"}, {"q": 1, "q2": null, "u": "tsp", "n": "vanilla extract"}, {"q": 15, "q2": null, "u": "", "n": "Oreo Chocolate Sandwich Cookies (chopped)"}]}], "steps": [{"section": "", "items": ["Preheat the oven to 375°F.", "Whisk together the dry ingredients in a large bowl: All-Purpose flour, cake flour, cornstarch, baking soda, baking powder and salt. Set aside.", "Using a stand mixer fitted with the paddle attachment, cream the cold butter with the sugars. Cream for 3-4 minute, it will look sort of like a paste. Scrape down the sides of the mixing bowl as needed.", "Then add in the egg, egg yolk, and vanilla extract and mix again until combined.", "Gradually add in the dry ingredients and then add in the chopped Oreo cookies and cookies.", "Shape dough into 7-large cookies (~5 oz. each). and bake for 10-12 minutes. Or you can make them much smaller and adjust the baking time.", "Let cookies cool on the cookie sheet for 15 minutes and then transfer to a wire cooling rack. ENJOY! ☺️"]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 12, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "red-velvet-cookies": {"schema": 2, "title": "Red Velvet Cookies", "category": "Desserts", "source": "https://inbloombakery.com/red-velvet-cookies/", "servings": null, "servingsUnit": "servings", "prepMin": 20, "cookMin": 12, "cuisine": "American", "protein": "", "freezer": true, "fridgeDays": 3, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 1.5, "q2": null, "u": "cups", "n": "+ 2 tbsps (204 g) all-purpose flour, spooned and leveled"}, {"q": 2, "q2": null, "u": "tbsps", "n": "(10 g) Dutch process cocoa powder"}, {"q": 0.5, "q2": null, "u": "tsp", "n": "baking soda"}, {"q": 0.5, "q2": null, "u": "tsp", "n": "baking powder"}, {"q": 0.5, "q2": null, "u": "tsp", "n": "salt"}, {"q": 0.75, "q2": null, "u": "cup", "n": "(168 g) salted butter, softened"}, {"q": 0.75, "q2": null, "u": "cup", "n": "(165 g) light brown sugar"}, {"q": 0.25, "q2": null, "u": "cup", "n": "(50 g) granulated white sugar"}, {"q": 2, "q2": null, "u": "", "n": "egg yolks, at room temperature"}, {"q": 1, "q2": null, "u": "tbsp", "n": "vanilla"}, {"q": 1, "q2": 1.5, "u": "tsp", "n": "red gel food coloring, (depending on how red you want the cookies)"}, {"q": 0.75, "q2": null, "u": "cup", "n": "(150 g) chopped white chocolate or white chocolate chips"}]}], "steps": [{"section": "", "items": ["Preheat oven to 350 degrees. Line two baking sheets with parchment paper and set aside.", "To a small bowl add the flour, cocoa powder, baking soda, baking powder and salt. Whisk to combine then set aside.", "Add softened, salted butter, light brown sugar, and granulated white sugar to a large bowl. Cream the butter and sugars with an electric mixer for two minutes, or until light and fluffy.", "Add in the egg yolks, vanilla and red food coloring and mix on medium speed for two minutes, or until the mixture is fluffy.", "Add in the dry ingredients and mix until combined.", "Then add in the white chocolate and mix just until incorporated.", "Scoop the dough into 18 balls. Arrange the dough two inches apart on the prepared baking sheets.", "Bake the cookies for 10-12 minutes. (Short amount for slightly underdone centers, full amount for a crispier edged cookie).", "Remove from the oven. Let the cookies cool for 5 minutes on the baking sheet, then transfer them to a cooling rack to cool for an additional 5 minutes before eating. (Add extra white chocolate chunks on top after baking if you desire.)", "Store leftovers in an airtight container for up to three days."]}], "notes": "***Measure your flour properly. This is always my #1 baking tip. Do not ever scoop a measuring cup into your flour. This will always lead to using too much flour. (Trust me, I've learned the hard way that I need to measure properly!) Instead, sprinkle spoonfuls of flour into your measuring cup and swipe excess flour off with the back of a knife. Or better yet, weigh your flour. 1 cup of flour equals 125 grams.", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 13, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "red-velvet-cupcakes": {"schema": 2, "title": "Red Velvet Cupcakes", "category": "Desserts", "source": "https://www.biggerbolderbaking.com/red-v before removing to a wire rack to fully cool.", "Once the cupcakes are completely cool, you can frost them with Cream Cheese Frosting", "Store these cupcakes in an airtight container in the refrigerator for up to two days. For longer storage, these cupcakes can be frozen in an airtight container for up to two months. Defrost for two hours at room temperature."]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 14, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "cream-cheese-frosting": {"schema": 2, "title": "Cream Cheese Frosting", "category": "Desserts", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": 10, "cookMin": 0, "cuisine": "American", "protein": "", "freezer": true, "fridgeDays": 4, "freezerMonths": 2, "tags": [], "ingredients": [{"section": "", "items": [{"q": 5, "q2": null, "u": "cups", "n": "(1 lb 4 oz/ 575g) powdered sugar, sifted lightly to remove any lumps"}, {"q": 2, "q2": null, "u": "cups", "n": "(16oz/454g) cream cheese, at room temperature"}, {"q": 0.5, "q2": null, "u": "cup", "n": "(4oz/115g) butter, at room temperature"}, {"q": 1, "q2": null, "u": "tablespoon", "n": "vanilla extract"}]}], "steps": [{"section": "", "items": ["In a large bowl, using an electric mixer on medium-high cream together the cream cheese and butter.", "Once light and fluffy add in the powdered sugar and vanilla and whip until it is smooth and creamy.", "This can be stored covered in the fridge for up to 4 days."]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 15, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "brownies": {"schema": 2, "title": "Brownies", "category": "Desserts", "source": "https://bakerbynature.com/the-best-cocoa-fudge-brownies/", "servings": null, "servingsUnit": "servings", "prepMin": 15, "cookMin": 30, "cuisine": "American", "protein": "", "freezer": true, "fridgeDays": 4, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 1, "q2": null, "u": "cup", "n": "(120g) all-purpose flour"}, {"q": 0.5, "q2": null, "u": "teaspoon", "n": "baking powder"}, {"q": 0.5, "q2": null, "u": "teaspoon", "n": "salt"}, {"q": 0.5, "q2": null, "u": "cup", "n": "(43g) unsweetened cocoa powder"}, {"q": 0.5, "q2": null, "u": "teaspoon", "n": "espresso powder optional (don't use if you don't like coffee)"}, {"q": 0.75, "q2": null, "u": "cup", "n": "(170g) unsalted butter"}, {"q": 2, "q2": null, "u": "tablespoons", "n": "(28ml) oil canola, vegetable, or coconut will work"}, {"q": 1.3333333333333333, "q2": null, "u": "cups", "n": "(265g) granulated sugar divided"}, {"q": 2, "q2": null, "u": "", "n": "large eggs"}, {"q": 1, "q2": null, "u": "", "n": "large egg yolk"}, {"q": 2, "q2": null, "u": "teaspoons", "n": "vanilla extract optional, but recommended"}, {"q": 0.75, "q2": null, "u": "cup", "n": "(128 grams) chocolate chips"}]}], "steps": [{"section": "", "items": ["Preheat oven to 350 degrees (F) (175 degreed C). Line an 9x9-inch baking pan with parchment paper. Spray lightly with non-stick baking spray and set aside.", "In a large bowl, sift together the flour, baking powder, salt, cocoa powder, and espresso powder. Set aside until needed.", "In a medium saucepan, combine the butter, oil, and 1/3 cup of the sugar. Heat over medium heat, stirring frequently, until butter is completely melted. Remove from heat.", "In a large mixing bowl, combine the eggs, egg yolk, vanilla (if using) and remaining sugar. Whisk until well combined, about 30 seconds.", "Slowly, pour the warm butter mixture into the egg mixture, adding it very gradually (a little bit at a time) and whisking constantly until completely combined.", "Add in the dry ingredients and chocolate chips and, using a rubber spatula, slowly stir until just combined. *Do not over mix! Stop stirring when you see the last trace of dry ingredients. Over mixing will give you cakey brownies.", "Scrape the batter into the prepared pan and smooth the top.", "Bake for 28 (to 30 minutes) or until the edges are firm and the top is shiny and slightly cracked.", "Place pan on a cooling rack and cool completely before slicing."]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 16, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "butter-chicken": {"schema": 2, "title": "Butter Chicken", "category": "Dinner", "source": "https://www.indianhealthyrecipes.com/butter-chicken/", "servings": null, "servingsUnit": "servings", "prepMin": null, "cookMin": null, "cuisine": "Indian", "protein": "Chicken", "freezer": true, "fridgeDays": 4, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "First Marination", "items": [{"q": 0.5, "q2": null, "u": "kg", "n": "(1.1 lbs) boneless chicken (cut to 1 inch pieces)"}, {"q": 0.5, "q2": 0.75, "u": "teaspoon", "n": "Kashmiri red chili powder (or paprika adjust to taste, reduce for kids)"}, {"q": 0.25, "q2": 0.3333333333333333, "u": "teaspoon", "n": "salt (adjust to taste)"}, {"q": 0.75, "q2": 1, "u": "tablespoon", "n": "lemon juice"}]}, {"section": "Second Marination", "items": [{"q": 0.3333333333333333, "q2": null, "u": "cup", "n": "Greek yogurt (hung curd/thick curd, refer notes)"}, {"q": 0.75, "q2": null, "u": "tablespoon", "n": "ginger garlic paste (or ½ tbsp fine grated ginger + ½ tbsp fine grated garlic)"}, {"q": 0.125, "q2": null, "u": "teaspoon", "n": "turmeric (haldi, optional)"}, {"q": 0.75, "q2": 1, "u": "teaspoon", "n": "garam masala (adjust to taste)"}, {"q": 0.5, "q2": null, "u": "teaspoon", "n": "cumin powder (optional)"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "coriander powder (optional)"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "kasuri methi (optional, dried fenugreek leaves)"}, {"q": 0.75, "q2": 1, "u": "tablespoon", "n": "oil"}]}, {"section": "For sauce", "items": [{"q": 2, "q2": 3, "u": "tablespoons", "n": "butter or ghee (divided)"}, {"q": 2, "q2": null, "u": "", "n": "inch cinnamon piece (optional, for extra flavor)"}, {"q": 2, "q2": 4, "u": "", "n": "green cardamoms (optional, for added flavor)"}, {"q": 2, "q2": 4, "u": "cloves", "n": "(optional)"}, {"q": 1.5, "q2": null, "u": "cups", "n": "(130 grams) onions sliced (optional, *updated, cuts down acidity from tomatoes)"}, {"q": 600, "q2": null, "u": "grams", "n": "(1.3 lbs.) fresh tomatoes (or 1 cup passata/canned tomato puree or ⅓ cup double concentrate tomato paste - for 1x)"}, {"q": 0.75, "q2": null, "u": "tablespoon", "n": "ginger garlic paste (or ½ tbsp each fine grated ginger and garlic)"}, {"q": 1, "q2": 2, "u": "", "n": "green chilies (optional, deseed, slit or chop)"}, {"q": 28, "q2": null, "u": "", "n": "(42 grams, ⅓ cup) whole raw cashews (soaked in hot water, sub with ¼ to ⅓ cup heavy cream)"}, {"q": 0.5, "q2": null, "u": "cup", "n": "water to blend (more if required)"}, {"q": 1, "q2": 2, "u": "teaspoons", "n": "Kashmiri chili powder (reduce for kids, adjust to taste)"}, {"q": 1, "q2": 1.5, "u": "teaspoons", "n": "garam masala (divided, adjust to taste)"}, {"q": 1, "q2": 1.5, "u": "teaspoon", "n": "coriander powder (optional, adjust to taste)"}, {"q": 0.5, "q2": null, "u": "teaspoon", "n": "cumin powder (optional, adjust to taste)"}, {"q": 0.5, "q2": 0.75, "u": "teaspoon", "n": "salt (adjust to taste)"}, {"q": 1, "q2": null, "u": "teaspoon", "n": "sugar (to balance the flavors)"}, {"q": 0.5, "q2": null, "u": "tablespoon", "n": "Kasuri methi (dried fenugreek leaves)"}, {"q": 1.5, "q2": null, "u": "cups", "n": "hot water to make gravy (cut down to 1 cup if omitting cashews)"}, {"q": 0.3333333333333333, "q2": null, "u": "cup", "n": "(80 to 100 ml) heavy cream or whipping cream (divided)"}, {"q": 2, "q2": null, "u": "tablespoons", "n": "coriander leaves (fine chopped to garnish)"}]}], "steps": [{"section": "", "items": ["Marinate chicken with lemon juice, chili powder and salt. Cover and rest for 20 minutes. Next add yogurt, kasuri methi, oil, turmeric, ginger garlic paste, coriander powder, cumin powder and garam masala powder.", "Marinate and rest for a minimum of 30 minutes, or overnight for best results. Cover and refrigerate.", "Optional – If using onion, sauté in 1 tablespoon oil until lightly golden, for 7 minutes. Cool down.", "To a blender, add tomatoes, sautéed onions, cashews and water. Blend to a smooth puree. If you want you can also blend the cashews separately with water to a smooth cream."]}, {"section": "Make the sauce", "items": ["Remove the chicken from the refrigerator, to bring it close to room temperature.", "Melt butter in a pan & add all the whole spices – cinnamon, cloves and cardamoms.", "When they begin to sizzle, stir in the ginger garlic paste & green chilies. Fry on a low heat, for a minute or 2, till it turns fragrant but not burnt.", "Turn off the heat and stir in red chili powder, garam masala, cumin and coriander powder.", "Stir in the tomato cashew puree. If it is not smooth, strain it to the pan.", "Mix well and cover partially. Bring it to a boil on a medium high heat, reduce the heat to low or medium. Cook until the puree turns thick, keep stirring occasionally.", "Pour hot water and simmer for 10 mins, until the sauce thickens & traces of fats are visible on top of the sauce. Remove the whole spices and discard at this stage."]}, {"section": "Grill or roast chicken", "items": ["Spread one tbsp. butter or ghee in a griddle/pan and heat it well. Place the marinated chicken pieces, spacing them a little apart.", "Fry on a medium heat for 2 mins and turn them. Don't burn and do not overcook. Cook till the chicken is just cooked and all the marinade dries up. It is not necessary to fully cook the chicken at this stage.", "This way roast the chicken pieces in 2 to 3 batches, depending on the size of your skillet."]}, {"section": "How to make Butter Chicken", "items": ["Add chicken to the butter chicken gravy. Pour more hot water (about ½ cup, not in the recipe) if the sauce is too thick. Cover and simmer for about 5 to 7 minutes till it becomes tender.", "Stir in salt, sugar and kasuri methi. Taste test and optionally add more garam masala & another tablespoon butter for additional flavour (both are optional).", "Turn off and stir in the heavy cream. Garnish Butter Chicken with chopped coriander leaves and some cream. Serve with Turmeric rice, steamed Basmati Rice, Butter naan or Cumin Rice."]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts.", "Transcribed from screenshots in the doc. Double-check amounts."], "order": 17, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "arroz-con-gandules": {"schema": 2, "title": "Arroz con gandules (3lbs)", "category": "Dinner", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": null, "cookMin": null, "cuisine": "Puerto Rican", "protein": "", "freezer": true, "fridgeDays": 4, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 2, "q2": null, "u": "latas", "n": "gandules"}, {"q": 1, "q2": null, "u": "ramo", "n": "cilantro"}, {"q": 1, "q2": null, "u": "paquete", "n": "3 lbs de arroz mediano"}, {"q": 5, "q2": null, "u": "cubos", "n": "sofrito, approx. 2-2.5 tazas"}, {"q": 1, "q2": null, "u": "", "n": "pimiento rojo"}, {"q": 1.5, "q2": null, "u": "latas", "n": "salsa tomate goya"}, {"q": null, "q2": null, "u": "", "n": "Adobo"}, {"q": null, "q2": null, "u": "", "n": "Sal"}, {"q": null, "q2": null, "u": "", "n": "Orégano"}, {"q": 1, "q2": null, "u": "hoja", "n": "laurel"}]}], "steps": [], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren'  medium low, simmer 12 minutes to thicken. Sauce should thicken enough to coat the back of a spoon.", "Add fresh thyme and keep warm.", "Allow steaks to rest 5 minutes, serve with warm mushroom cream sauce."]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 19, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "pernil-puertorriqueno": {"schema": 2, "title": "Pernil Puertorriqueño (sin piel)", "category": "Dinner", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": 30, "cookMin": 360, "cuisine": "Puerto Rican", "protein": "Pork", "freezer": true, "fridgeDays": 4, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 2, "q2": null, "u": "", "n": "Pernil, 8 lbs cada uno"}, {"q": 24, "q2": null, "u": "dientes", "n": "ajo (1.5 por cada libra)"}, {"q": 0.5, "q2": null, "u": "taza", "n": "Vinagre"}, {"q": 1.5, "q2": null, "u": "tsp", "n": "Pimienta Negra"}, {"q": 1, "q2": null, "u": "tbsp", "n": "+ 1 tsp Orégano"}, {"q": null, "q2": null, "u": "", "n": "Sal (1 tsp por cada libra)"}]}], "steps": [{"section": "", "items": ["Mezclar ajo y vinagre en un procesador de alimentos. El vinagre debe cubrir el ajo, pero la medida en los ingredients es la correcta.", "Añadir pimienta negra (verás que el ajo se oscurecerá) y mezclar.", "Añadir oregano y mezclar.", "Cortar ranuras profundas por cada libra de pernil, de 1-2 pulgadas de ancho en ambos lados del pernil.", "Echar 1 tsp de sal en cada ranura. Masajear bien!", "Echar 1 tsp de mezcla de ajo en cada ranura.", "Echar mezcla sobrante por encima del resto del pernil.", "Cubrir con papel de aluminio y dejar marinar por 2 noches", "Cocinar cubierto a 350F por 5-6 horas", "Destapar, echar caldito/grasa derretida por encima del pernil y cocinar descubierto por 7 minutos en broil (high). Monitorear bien que no se queme.", "Remover pernil del horno t": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts."], "order": 22, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "bacalaitos": {"schema": 2, "title": "Bacalaitos", "category": "Dinner", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": null, "cookMin": null, "cuisine": "Puerto Rican", "protein": "Fish", "freezer": false, "fridgeDays": 2, "freezerMonths": 0, "tags": [], "ingredients": [{"section": "", "items": [{"q": null, "q2": null, "u": "", "n": "Harina"}, {"q": null, "q2": null, "u": "", "n": "Agua"}, {"q": null, "q2": null, "u": "", "n": "Bacalao"}, {"q": null, "q2": null, "u": "", "n": "Perejil"}]}], "steps": [{"section": "", "items": ["Enjuagar bacalao", "Cortar en trozos de dos cm y calentar bacalao en agua como por 10min", "Dejar enfriar"]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts.", "No amount for: Harina, Bacalao, Perejil"], "order": 23, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "french-onion-soup": {"schema": 2, "title": "French Onion Soup", "category": "Dinner", "source": "https://www.recipetineats.com/french-onion-soup/", "servings": 2, "servingsUnit": "servings", "prepMin": 10, "cookMin": 85, "cuisine": "French", "protein": "", "freezer": true, "fridgeDays": 4, "freezerMonths": 4, "tags": [], "ingredients": [{"section": "", "items": [{"q": 50, "q2": null, "u": "g", "n": "unsalted butter (1.75oz)"}, {"q": 0.75, "q2": null, "u": "kg", "n": "brown / yellow onions, peeled, halved, thinly sliced top to bottom (Note 1) (1.25 lb)"}, {"q": 0.5, "q2": null, "u": "cup", "n": "(185ml) dry white wine, optional (Note 2)"}, {"q": 1, "q2": null, "u": "tbsp", "n": "flour, plain / all purpose"}, {"q": 0.75, "q2": null, "u": "litres", "n": "good quality beef broth./stock OR chicken **doesn't have to be unsalted. (3 cups)"}, {"q": 1, "q2": null, "u": "", "n": "dried bay leaf"}, {"q": 2, "q2": null, "u": "sprigs", "n": "fresh thyme"}, {"q": 2, "q2": null, "u": "tbsp", "n": "soy sauce"}, {"q": null, "q2": null, "u": "", "n": "Salt and pepper"}]}], "steps": [{"section": "Caramelise onions (see notes for slow cooker option)", "items": ["Melt butter in a heavy based casserole pot over medium heat. When it starts to foam, add onions and stir to coat in butter.", "30 min on medium low: Turn heat down to medium low. Cook for 30 minutes stirring every few minutes, until the onions have softened and are semi transparent.", "Salt, 20 min on medium high: Turn heat up to medium or medium high. Add salt, and cook for a further 20 -- 30 minutes, stirring more regularly, until onions are deep golden and sweet."]}, {"section": "Make soup", "items": ["Deglaze: Add wine, then simmer rapidly for 2 minutes until mostly evaporated, stirring to scrape the bottom of the pot.", "Flour: Sprinkle flour over the onion and cook for 1 minute.", "Add broth & herbs: Add broth, thyme and bay leaves.", "Simmer: Cover, lower heat so it's simmering gently then simmer for 30 minutes.", "Serve: Season to taste with salt and pepper. Ladle into bowls. Top with 1 or 2 slices of cheesy toast."]}, {"section": "Cheese toast", "items": ["Preheat grill / broiler to high.Toast each side of bread until light golden.", "Top bread with cheese, then grill until melted and some brown spots appear."]}], "notes": "1. Onions -- halve them then cut from the top to bottom (see video). It makes them hold their shape better when cooking and you don't get stringy bits. But it's not a big deal! Half the onions in the video were accidentally cut the other way.\n\n2. Wine is used to deglaze the pot here, to get the brown stuff off the base of the pot and also the wine adds flavour into the soup broth. It's fine to skip it -- the beef broth ends up having the same deglazing effect.\n\nAny non-sweet, non-woody wine is fine. Sauvignon Blanc, Pinot Gris are what I use.\n\n3. Broth/stock -- French Onion Soup can be made with chicken or beef broth. It is more commonly made with beef stock, from what I have observed.\n\nUse a good quality beef stock. I personally do not recommend mainstream brands from major supermarkets in Australia. I use Maggie Beer and Moredough from Harris Farms, , or private labels from butchers.\n\nIt is better to use chicken or vegetable broth rather than sub-standard beef broth.\n\nBest to use low salt and add salt if required.\n\n4. Bread -- The idea with the recipe is that you can use a spoon to cut through the bread into the soup to eat it (see video). So it's best not to use chewy artisan breads like sourdough. The softer the crumb, the better. Even a thick standard sandwich bread would work!\n\n5. SLOW COOKER CARAMELISED ONIONS (see recipe video above) -- Read in post for background. Directions: Place onions in slow cooker, toss with 2 tbsp (30g) melted butter. Slow cook on LOW for 10 hours. Onion will be browned but won't have a proper caramelised flavour. Add 2 tbsp (30g) butter into large pot over medium high heat. Tip in all the onions and SOME (not all) of the juices from slow cooker. Cook 10 to 15 minutes until deeply caramelised. Proceed with recipe.\n\n6. Nutrition per serving, assuming 6 servings", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": [], "order": 24, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "salsa-verde": {"schema": 2, "title": "Salsa Verde", "category": "Dinner", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": 5, "cookMin": 20, "cuisine": "Mexican", "protein": "", "freezer": true, "fridgeDays": 5, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 8, "q2": null, "u": "", "n": "tomatillos de hoja"}, {"q": 2, "q2": null, "u": "", "n": "chiles serranos"}, {"q": 0.25, "q2": null, "u": "", "n": "cebolla"}, {"q": null, " otal aguada", "Para cosinar solo lo pones en una casuela y lo dejas que se cueza con su jugo que ace dela carne y el chile asta que se evapore todo y lo pruebas de sal si le falta le pones mas", "En caso de que no sientas que save a condimentos le puedes agregar más pero de los que están molidos", "Si me avisas también se nesesitas se bolla picada en medias lunas para freír y que se caramelice en la casuela donde freíste la carne la sacas y así pones la sevolla a freír con aceite y sal", "Para que te quede así tienes que dejar que se pegue un poco la carne en la casuela y después sacas la carne y la pones la sevolla con el asiente y sal y se fríe", "Si tú chile pinta mucho pole menos chiles"]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts.", "No amount for: Canela entera, la mitad del tamaño de tu uña 💅🏻 pequeña"], "order": 26, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "birria": {"schema": 2, "title": "Birria", "category": "Dinner", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": 30, "cookMin": 75, "cuisine": "Mexican", "protein": "Beef", "freezer": true, "fridgeDays": 4, "freezerMonths": 3, "tags": [], "ingredients": [{"section": "", "items": [{"q": 5, "q2": null, "u": "libra", "n": "carne de vaca"}, {"q": 3, "q2": null, "u": "", "n": "chiles Nuevo Mexico o Guajillo"}, {"q": 4, "q2": null, "u": "", "n": "tomate"}, {"q": 2, "q2": null, "u": "", "n": "cebolla"}, {"q": null, "q2": null, "u": "", "n": "El jugo de una china"}, {"q": 6, "q2": null, "u": "dientes", "n": "ajo 🧄"}, {"q": 0.25, "q2": null, "u": "taza", "n": "aceite"}, {"q": null, "q2": null, "u": "", "n": "Sal, pimienta, clavos, cominos al gusto"}, {"q": 6, "q2": null, "u": "", "n": "clavos"}, {"q": 2, "q2": null, "u": "piscas", "n": "tomillo"}, {"q": 3, "q2": null, "u": "piscas", "n": "comino"}, {"q": 2, "q2": null, "u": "piscas", "n": "orégano"}]}], "steps": [{"section": "", "items": ["Picar y lavar carne, secar con toallas, marinar en bolsa ziploc", "(10-15min sofriendo)", "Fuego medio-alto", "remover semilla y venas del chile", "Freír chiles por 5-10 segundos. Algunos chiles deben quedar mas crujientes (como quemaditos) que otros. Remover del aceite.", "Freír cebolla picada en trozos y ajo completo sin picar hasta que doren.", "Agregar 3 jitomates cortados en ruedos. Freír hasta que se deshaga el tomate. Agregar chiles.", "Agregar aprox 1 taza de agua. Hervir y mezclar suavemente por 5min en total (el agua evapore un poco). sumergir chiles para facilitar hidratación. Apagar fuego y agregar especias: sal (POCO), clavos, pimienta, comino, thyme (tomillo) POQUITO, orégano POQUITO. NO MEZCLAR para que no se cozan LOS CONDIMENTOS sino que solo hidratados y blandos. Remover del fuego y dejar reposar 40min hasta que se ponga tibio. MEZCLAR en la licuadora. Dejar enfriar y luego mezclar con la carne.", "Poner olla al fuego y agua. esperar que el agua se ponga tibia. echar carne y agregar agua tibia (ponla en el micro o en la estufa) hasta que el juguito cubra la carne (2-3tazas).", "Agregar hoja de laurel y sal.", "si la carne no tiene grasa, agregar 2-3 cucharadas de aceite.", "cubrir con tapa y papel de aluminio.", "dejas cocer por 1 hr (temp 7.) y checar que la carne esté blandita. desmenuzar carne con dos tenedores. Tantear con el tiempo de cocción hasta que esté blandita a tu gusto."]}], "notes": "", "equipment": [], "photoUrl": "", "photoId": "", "favorite": false, "flags": ["Servings weren't in the doc. Add them to scale amounts.", "No amount for: El jugo de una china"], "order": 27, "createdAt": "2026-11-16T00:52:26.104Z", "updatedAt": "2026-11-16T00:52:26.104Z"}, "arroz-mexicano": {"schema": 2, "title": "Arroz Mexicano", "category": "Dinner", "source": "", "servings": null, "servingsUnit": "servings", "prepMin": null, "cookMin": null, "cuisine": "Mexican", "protein": "", "freezer": true, "fridgeDays": function allergenHits(texts){

    const f = hasAny(t, FISH); if (f && !/ fish sauce /.test(lc(t)) ) hits.push({kind:"Fish", word:f.trim(), line:t});
    if (/ fish sauce /.test(lc(t))) hits.push({kind:"Fish", word:"fish sauce", line:t});

/* ---------- read a recipe out of copied page text, no Claude needed ---------- */
const H_ING = /^(ingredients?|ingredientes|what you('| wi)ll need)\s*:?\s*$/i;
const H_STEP = /^(instructions?|directions?|method|steps|preparation|how to make( it)?|instrucciones|preparaci[oó]n|procedimiento)\s*:?\s*$/i;
const H_END = /^(notes?|recipe notes|tips|nutrition( facts| information)?|video|did you make this|equipment|course|cuisine|keyword|calories|author|rate this recipe|share|pin|reviews?|comments?|leave a (comment|review)|you may also like|related|more recipes|storage|faq|notas)\b/i;
const H_NOTES = /^(notes?|recipe notes|tips|notas)\s*:?\s*$/i;
const JUNK = /^(▢|☐|\s)*$|^(print|pin|save|jump to recipe|rate|review|servings?|prep time|cook time|total time|calories|course|cuisine|keyword|author|yield|units?|us customary|metric|1x|2x|3x|cups?|grams?|video|play|x)\s*:?\s*$|^\d+x$|^(advertisement|ad)$/i;
function cleanLine(l){ return String(l).replace(/[▢☐✓✔•●▪]/g, "").replace(/^\s*(?:[-*]|\d+[.)])\s+/, "").replace(/\s+/g, " ").trim(); }

function readMinutes(text, label){
  const m = text.match(new RegExp(label + "\\s*:?\\s*(?:(\\d+)\\s*(?:hours?|hrs?|h)\\s*)?(?:(\\d+)\\s*(?:minutes?|mins?|m)\\b)?", "i"));
  if (!m || (!m[1] && !m[2])) return null; return (+(m[1]||0))*60 + (+(m[2]||0));
}
function parseRecipeText(text, url){
  const lines = String(text).split(/\r?\n/).map(l => l.trim());
  // recipe cards usually come last, so use the last Ingredients heading that has a steps heading after it
  let ingAt = -1, stepAt = -1;
  for (let i = lines.length - 1; i >= 0; i--){
    if (H_ING.test(cleanLine(lines[i]))){
      const s = lines.findIndex((l, j) => j > i && H_STEP.test(cleanLine(l)));
      if (s > i && s - i > 2){ ingAt = i; stepAt = s; break; }
    }
  }
  if (ingAt < 0) return null;
  // sections: a short line without numbers that ends with ":" or is Title Case and followed by items
  const isSection = (l, next) => l.length < 40 && !/\d/.test(l) && (/:$/.test(l) || (/^(for (the )?)/i.test(l))) && !!next;
  const ingredients = [{section:"", items:[]}];
  for (let i = ingAt + 1; i < stepAt; i++){
    const l = cleanLine(lines[i]); if (!l || JUNK.test(l)) continue;
    if (H_END.test(l) && !/^equipment/i.test(l)) continue;
    if (isSection(l, lines[i+1])){ ingredients.push({section: l.replace(/:$/, ""), items: []}); continue; }
    ingredients[ingredients.length-1].items.push(parseIng(l));
  }
  const steps = [{section:"", items:[]}], notes = [];
  let i = stepAt + 1, inNotes = false;
  for (; i < lines.length; i++){
    const l = cleanLine(lines[i]); if (!l || JUNK.test(l)) continue;
    if (H_NOTES.test(l)){ inNotes = true; continue; }
    if (H_END.test(l) && !H_NOTES.test(l)){ if (inNotes || steps.some(s => s.items.length)) break; else continue; }
    if (inNotes){ notes.push(l); if (notes.length > 12) break; continue; }
    if (isSection(l, lines[i+1]) || (/^[A-Z][A-Za-z &]+:$/.test(l))){ steps.push({section: l.replace(/:$/, ""), items: []}); continue; }
    if (l.length < 4) continue;
    steps[steps.length-1].items.push(l);
  }
  const ing = ingredients.filter(s => s.items.length), st = steps.filter(s => s.items.length);
  if (!ing.length) return null;
  const head = lines.slice(0, ingAt).join("\n");
  const sv = head.match(/(?:servings|serves|yield|makes)\s*:?\s*(\d+)\s*([a-z]*)/i);
  const flags = ["Read from the page text without Claude. Check the amounts, steps and section headings."];
  if (!st.length) flags.push("No steps were found. Add them, or paste the page again including the instructions.");
  return {title: titleFromUrl(url), ingredients: ing, steps: st, notes: notes.join("\n"),
    servings: sv ? +sv[1] : null, servingsUnit: sv && sv[2] && !/^(servings?|people|x)$/i.test(sv[2]) ? sv[2] : "servings",
    prepMin: readMinutes(head, "prep(?:aration)? time"), cookMin: readMinutes(head, "cook(?:ing)? time"), flags};
}
