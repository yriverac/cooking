<script>
(() => {
"use strict";
/* ---------- state ---------- */
const S = { recipes: [], loaded: false, canWrite: true, db: null, assets: null, sample: null, user: null,
  cat: "All", q: "", scale: {}, plans: {}, planUnsub: null, planWeek: null, saving: false };
const CATS = ["Drinks","Appetizers","Desserts","Dinner"];
const TILE = {Drinks:"--t-drinks",Appetizers:"--t-app",Desserts:"--t-dess",Dinner:"--t-dinner"};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view = $("#view");
const ICON = {
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  heartO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.3-9-8.6C1.6 8.3 3.5 5 6.8 5c2 0 3.4 1 5.2 3 1.8-2 3.2-3 5.2-3 3.3 0 5.2 3.3 3.8 6.4C19 15.7 12 20 12 20z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  timer:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>'
};

/* ---------- utils ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function toast(t){ const el = document.createElement("div"); el.className="toast"; el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(), 2600); }
function slug(t){ return (String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48) || "recipe") + "-" + Math.random().toString(36).slice(2,6); }
function tileVar(cat){ return `var(${TILE[cat] || "--t-other"})`; }
function thumb(r, cls=""){
  const img = r.photoUrl ? `<img src="${esc(r.photoUrl)}" alt="" loading="lazy">` : `<span class="initial">${esc((r.title||"?").trim()[0] || "?")}</span>`;
  return `<div class="thumb ${cls}" style="background:${tileVar(r.category)}">${img}</div>`;
}
function allIngredients(r){ return (r.ingredients||[]).flatMap(s => s.items||[]); }
function flatSteps(r){ return (r.steps||[]).flatMap(s => (s.items||[]).map(t => ({section:s.section||"", text:t}))); }
function stepCount(r){ return flatSteps(r).length; }
function byId(id){ return S.recipes.find(r => r.id === id); }

/* quantities: parse a leading amount and scale it */
const UF = {"¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
const NUM = "(?:\\d+\\s+\\d+\\/\\d+|\\d+\\s*[¼½¾⅓⅔⅛⅜⅝⅞]|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[¼½¾⅓⅔⅛⅜⅝⅞])";
const QRE = new RegExp(`^(\\s*)(${NUM})(\\s*(?:-|–|to|a)\\s*(${NUM}))?`);
function toNum(s){
  s = s.trim().replace(",", ".");
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if ((m = s.match(/^(\d+)\s*([¼½¾⅓⅔⅛⅜⅝⅞])$/))) return +m[1] + UF[m[2]];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if (UF[s] != null) return UF[s];
  return parseFloat(s);
}
function fmtNum(n){
  if (n >= 20) return String(Math.round(n));
  const whole = Math.floor(n), frac = n - whole;
  const F = [[0,""],[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[2/3,"⅔"],[.75,"¾"],[.875,"⅞"],[1,""]];
  let best = F[0], d = 9;
  for (const f of F){ const dd = Math.abs(frac - f[0]); if (dd < d){ d = dd; best = f; } }
  if (d > .04) return String(+n.toFixed(2));
  const w = best[0] === 1 ? whole + 1 : whole;
  return (w ? String(w) : "") + (best[1] ? best[1] : "") || "0";
}
function scaleLine(line, k){
  const m = line.match(QRE);
  if (!m) return {html: esc(line), qty: null};
  const a = toNum(m[2]), b = m[4] ? toNum(m[4]) : null;
  if (!isFinite(a)) return {html: esc(line), qty: null};
  const q = k === 1 ? (m[2] + (m[3]||"")).trim() : fmtNum(a*k) + (b != null ? "–" + fmtNum(b*k) : "");
  const rest = line.slice(m[0].length);
  return {html: `${esc(m[1])}<span class="qty">${esc(q)}</span>${esc(rest)}`, qty: a*k, rest};
}
/* timers inside a step */
function findTimes(text){
  const out = []; const re = /(\d+(?:[.,]\d+)?)(?:\s*(?:-|–|to|a)\s*(\d+(?:[.,]\d+)?))?\s*(hours?|hrs?|horas?|hr|minutes?|mins?|minutos?|min)\b/gi; let m;
  while ((m = re.exec(text))){
    const unit = /^h/i.test(m[3]) ? 60 : 1;
    const lo = parseFloat(m[1].replace(",", ".")), hi = m[2] ? parseFloat(m[2].replace(",", ".")) : null;
    const mins = lo*unit;
    if (mins > 0 && mins <= 24*60) out.push({mins, label: m[0].trim(), hi: hi ? hi*unit : null});
  }
  return out.slice(0,3);
}

/* ---------- capability bootstrap ---------- */
const sync = $("#sync");
function setSync(t){ sync.textContent = t; }
async function boot(){
  route();
  window.addEventListener("hashchange", route);
  const c = window.claude;
  if (!c?.use){ setSync("Open this page in Claude to load your recipes."); S.loaded = true; route(); return; }
  const [db, user, assets, sample] = await Promise.all(["db","user","assets","sample"].map(n => c.use(n).catch(()=>null)));
  Object.assign(S, {db, user, assets, sample});
  if (user){
    try {
      const w = await user.can?.("data.write");
      const own = await user.isOwner?.();
      S.canWrite = (w === null || w === undefined) ? true : (!!w || !!own);
    } catch {}
  }
  if (!db){ S.loaded = true; S.canWrite = false; setSync("Sign in to Claude to see your recipes."); route(); return; }
  let timer = setTimeout(() => setSync("Can't reach your recipe box yet. Showing what's saved on this device."), 10000);
  subPantry();
  db.collection("recipes").onSnapshot(snap => {
    S.recipes = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b)=> (a.order ?? 999) - (b.order ?? 999) || String(a.title).localeCompare(b.title));
    S.loaded = true;
    if (!snap.metadata.fromCache){ clearTimeout(timer); setSync(`${S.recipes.length} recipes · synced across your devices`); }
    rerenderIfSafe();
  }, e => { clearTimeout(timer); S.loaded = true; setSync("Your recipes couldn't load. Reload the page to try again."); rerenderIfSafe(); });
}
function subPantry(){
  S.db.doc("pantry/home").onSnapshot(snap => { S.pantry = snap.exists ? snap.data() : null; S.pantryKeys = null; if (["pantry","prep"].includes(currentRoute().name) && !cook.open && !document.activeElement?.matches?.("input,textarea")) route(); }, () => {});
}
function rerenderIfSafe(){
  const h = currentRoute();
  if (h.name === "new" || h.name === "edit" || h.name === "import") return; // don't wipe a form in progress
  if (cook.open){ return; }
  route();
}

/* ---------- routing ---------- */
function currentRoute(){
  const h = location.hash.replace(/^#/, "");
  let m;
  if (!h || h === "home") return {name:"home"};
  if (h === "prep") return {name:"prep"};
  if (h === "pantry") return {name:"pantry"};
  if (h === "new") return {name:"new"};
  if (h === "import") return {name:"import"};
  if ((m = h.match(/^edit-(.+)$/))) return {name:"edit", id:m[1]};
  if ((m = h.match(/^r-(.+)$/))) return {name:"recipe", id:m[1]};
  return {name:"home"};
}
let lastRoute = "";
function route(){
  const r = currentRoute();
  const key = r.name + (r.id||"");
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", false));
  const navKey = r.name === "recipe" || r.name === "edit" ? "home" : r.name;
  const cur = document.querySelector(`[data-nav="${navKey}"]`); if (cur) cur.setAttribute("aria-current","page");
  document.querySelectorAll("[data-write]").forEach(a => a.hidden = !S.canWrite);
  if (r.name === "prep") ensurePlan();
  ({pantry: renderPantry, home: renderHome, recipe: renderRecipe, new: () => renderEditor(null), edit: renderEditFor, import: renderImport, prep: renderPrep})[r.name](r);
  if (key !== lastRoute){ window.scrollTo(0,0); lastRoute = key; }
}

/* ---------- home ---------- */
function renderHome(){
  const counts = {}; S.recipes.forEach(r => counts[r.category] = (counts[r.category]||0)+1);
  const cats = [...new Set([...CATS, ...S.recipes.map(r=>r.category).filter(Boolean)])];
  const q = S.q.trim().toLowerCase();
  let list = S.recipes.filter(r => S.cat === "All" || (S.cat === "Favorites" ? r.favorite : r.category === S.cat));
  if (q) list = list.filter(r => (r.title + " " + allIngredients(r).join(" ")).toLowerCase().includes(q));
  const greet = ["What are we", "cooking", "today?"];
  view.innerHTML = `
  <section class="wrap hero">
    <h1>${greet[0]} <span class="it">${greet[1]}</span> ${greet[2]}</h1>
    <p>Your family recipes, saved finds and weeknight dinners in one place. Open one and follow along step by step.</p>
    <label class="search">${ICON.search}<input id="q" type="search" placeholder="Search recipes or ingredients (e.g. gandules, butter)" value="${esc(S.q)}" aria-label="Search recipes"></label>
  </section>
  <section class="wrap">
    <div class="cats" role="group" aria-label="Categories">
      ${["All", ...cats, "Favorites"].map(c => `<button class="cat" data-cat="${esc(c)}" aria-pressed="${S.cat===c}">
        <span class="disc" style="background:${c==="All"||c==="Favorites" ? "var(--rose)" : tileVar(c)}">${c==="Favorites" ? '<span style="width:26px;height:26px;display:block">'+ICON.heart+'</span>' : esc(c[0])}</span>${esc(c)}
        <small>${c==="All" ? S.recipes.length : c==="Favorites" ? S.recipes.filter(r=>r.favorite).length : (counts[c]||0)}</small></button>`).join("")}
    </div>
    <div class="section-head"><h2>${S.cat === "All" ? (q ? "Search results" : "All recipes") : esc(S.cat)}</h2>
      <span class="row">${S.canWrite ? `<a class="btn sm" href="#new">Add a recipe</a><a class="btn sm ghost" href="#import">Import from a link</a>` : ""}</span></div>
    ${!S.loaded ? `<div class="empty"><h3>Opening your recipe box…</h3><p class="muted">Your recipes will appear here in a moment.</p></div>`
      : list.length ? `<div class="grid">${list.map(card).join("")}</div>`
      : S.recipes.length ? `<div class="empty"><h3>Nothing matches “${esc(S.q || S.cat)}”</h3><p class="muted">Try another word, or clear the search.</p><button class="btn quiet" id="clear">Show all recipes</button></div>`
      : `<div class="empty"><h3>Your recipe box is empty</h3><p class="muted">${S.canWrite && S.db ? `Your ${Object.keys(SEED.recipes).length} recipes from “My Cooking Recipes” and your pantry inventory are ready to load.` : "Add your first recipe by typing it in, or paste one from a website."}</p><div class="row">${S.canWrite && S.db ? `<button class="btn" id="loadseed">Load my recipes</button>` : ""}<a class="btn ghost" href="#new">Add a recipe</a></div><p class="muted" id="seedmsg" style="font-size:13px;margin:0"></p></div>`}
    <div style="height:56px"></div>
  </section>`;
  const qi = $("#q");
  qi.addEventListener("input", () => { S.q = qi.value; const pos = qi.selectionStart; renderHome(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); });
  view.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { S.cat = b.dataset.cat; renderHome(); });
  $("#loadseed")?.addEventListener("click", loadSeed);
  $("#clear")?.addEventListener("click", () => { S.q = ""; S.cat = "All"; renderHome(); });
}
function card(r){
  const n = allIngredients(r).length, st = stepCount(r);
  return `<a class="card" href="#r-${esc(r.id)}">${thumb(r).replace('</div>', r.favorite ? `<span class="fav">${ICON.heart.replace('<svg','<svg width="16" height="16"')}</span></div>` : '</div>')}
    <div class="meta"><span class="label">${esc(r.category || "Recipe")}</span><h3>${esc(r.title)}</h3>
    <span class="sub">${n} ingredients${st ? ` · ${st} steps` : ""}${r.servings ? ` · ${esc(r.servings)}` : ""}</span></div></a>`;
}

let SEED = {recipes:{}, pantry:null};
try { SEED = JSON.parse(document.getElementById("seed").textContent); } catch {}
async function loadSeed(){
  const b = $("#loadseed"), m = $("#seedmsg"); if (b) b.disabled = true;
  const entries = Object.entries(SEED.recipes); let n = 0;
  try {
    for (const [id, d] of entries){ if (!byId(id)) await S.db.collection("recipes").doc(id).set(d); n++; if (m) m.textContent = `Loading ${n} of ${entries.length}…`; }
    if (SEED.pantry && !S.pantry) await S.db.doc("pantry/home").set(SEED.pantry);
    toast("Your recipes are in");
  } catch(e){ if (m) m.textContent = `Stopped after ${n} recipes. Tap Load my recipes again to finish.`; if (b) b.disabled = false; }
}

/* ---------- recipe view ---------- */
function progressKey(id){ return "progress:" + id; }
function renderRecipe({id}){
  const r = byId(id);
  if (!r){ view.innerHTML = `<div class="wrap" style="padding-block:60px"><div class="empty"><h3>${S.loaded ? "This recipe isn't in your box" : "Opening recipe…"}</h3>${S.loaded ? '<a class="btn" href="#home">Back to recipes</a>' : ""}</div></div>`; return; }
  const k = S.scale[id] || 1;
  const prog = store.get(progressKey(id), {ing:[], steps:[]});
  let ii = 0, si = 0;
  const host = r.source ? (()=>{ try { return new URL(r.source).hostname.replace(/^www\./,""); } catch { return r.source; } })() : "";
  view.innerHTML = `
  <article class="wrap recipe">
    <div class="recipe-head">
      ${thumb(r)}
      <div>
        <a href="#home" class="label" style="text-decoration:none;color:var(--accent)">← ${esc(r.category || "Recipes")}</a>
        <h1 style="margin-top:10px">${esc(r.title)}</h1>
        <div class="facts">
          ${r.servings ? `<div><span class="label">Makes</span><b>${esc(r.servings)}${k!==1?` ×${fmtNum(k)}`:""}</b></div>` : ""}
          ${r.time ? `<div><span class="label">Time</span><b>${esc(r.time)}</b></div>` : ""}
          <div><span class="label">Ingredients</span><b>${allIngredients(r).length}</b></div>
          <div><span class="label">Steps</span><b>${stepCount(r)}</b></div>
        </div>
        ${host ? `<p style="margin:14px 0 0" class="muted">From <a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(host)}</a></p>` : ""}
        <div class="actions">
          ${stepCount(r) ? `<button class="btn" id="cook">Start cooking</button>` : ""}
          <button class="btn ghost" id="toprep">Add to meal prep</button>
          ${S.canWrite ? `<button class="btn quiet" id="fav" aria-pressed="${!!r.favorite}">${r.favorite ? "★ Favorite" : "☆ Favorite"}</button><a class="btn quiet" href="#edit-${esc(r.id)}">Edit</a>` : ""}
        </div>
      </div>
    </div>
    <div style="min-width:0;display:flex;flex-direction:column;gap:20px">
      <section class="panel">
        <div class="row" style="justify-content:space-between"><h2>Instructions</h2>${prog.steps.length ? `<button class="btn sm quiet" id="resetS">Reset progress</button>` : ""}</div>
        ${(r.steps||[]).length ? (r.steps||[]).map(sec => `<div class="step-sec">${sec.section ? `<h4>${esc(sec.section)}</h4>` : ""}
          <ol class="steps" style="counter-reset:s ${si}">${(sec.items||[]).map(t => { const i = si++; const times = findTimes(t);
            return `<li data-s="${i}" class="${prog.steps.includes(i) ? "done" : ""}"><div>${esc(t)}${times.length ? `<div>${times.map(tm => `<button class="timer-chip" data-timer="${tm.mins}" data-label="${esc(r.title)}: ${esc(tm.label)}">${ICON.timer} ${esc(tm.label)}</button>`).join(" ")}</div>` : ""}</div></li>`; }).join("")}</ol></div>`).join("")
          : `<p class="muted">No steps saved yet.${S.canWrite ? ` <a href="#edit-${esc(r.id)}">Add them</a>.` : ""}</p>`}
      </section>
      ${(r.notes||[]).length ? `<section class="panel notes"><h2>Notes</h2>${r.notes.map(n => `<p>${esc(n)}</p>`).join("")}</section>` : ""}
      ${(r.equipment||[]).length ? `<section class="panel"><h2>Equipment</h2><ul>${r.equipment.map(n => `<li>${esc(n)}</li>`).join("")}</ul></section>` : ""}
    </div>
    <aside class="side">
      <section class="panel">
        <div class="row" style="justify-content:space-between"><h2>Ingredients</h2></div>
        <div class="scale" role="group" aria-label="Scale recipe">${[.5,1,2,3].map(x => `<button data-k="${x}" aria-pressed="${k===x}">${x===.5?"½":x}×</button>`).join("")}</div>
        ${(r.ingredients||[]).map(sec => `<div class="ing-sec">${sec.section ? `<h4>${esc(sec.section)}</h4>` : ""}<ul class="checks">${(sec.items||[]).map(t => { const i = ii++;
          return `<li data-i="${i}" class="${prog.ing.includes(i) ? "done" : ""}"><span class="box"></span><span class="txt">${scaleLine(t,k).html}${pantryHas(t) ? ` <span class="have">in pantry</span>` : ""}</span></li>`; }).join("")}</ul></div>`).join("")}
        ${prog.ing.length ? `<button class="btn sm quiet" id="resetI" style="margin-top:12px">Uncheck all</button>` : ""}
      </section>
    </aside>
  </article>`;
  const save = () => store.set(progressKey(id), prog);
  view.querySelectorAll("[data-i]").forEach(li => li.onclick = () => { const i = +li.dataset.i; const at = prog.ing.indexOf(i); at<0 ? prog.ing.push(i) : prog.ing.splice(at,1); li.classList.toggle("done"); save(); });
  view.querySelectorAll("[data-s]").forEach(li => li.onclick = e => { if (e.target.closest("[data-timer]")) return; const i = +li.dataset.s; const at = prog.steps.indexOf(i); at<0 ? prog.steps.push(i) : prog.steps.splice(at,1); li.classList.toggle("done"); save(); });
  view.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { S.scale[id] = +b.dataset.k; renderRecipe({id}); });
  view.querySelectorAll("[data-timer]").forEach(b => b.onclick = e => { e.stopPropagation(); startTimer(+b.dataset.timer, b.dataset.label); });
  $("#resetS")?.addEventListener("click", () => { prog.steps = []; save(); renderRecipe({id}); });
  $("#resetI")?.addEventListener("click", () => { prog.ing = []; save(); renderRecipe({id}); });
  $("#cook")?.addEventListener("click", () => openCook([r], k));
  $("#toprep").onclick = () => openDayPicker(r);
  $("#fav")?.addEventListener("click", async () => { try { await S.db.collection("recipes").doc(r.id).update({favorite: !r.favorite}); } catch(e){ toast("Couldn't save. Try again."); } });
}

/* ---------- cook mode ---------- */
const cook = { open:false, list:[], idx:0, k:1, lock:null, showIngs:true };
function openCook(recipes, k=1, kMap){
  cook.list = []; cook.recipes = recipes; cook.kMap = kMap || {};
  recipes.forEach(r => flatSteps(r).forEach((s, i, all) => cook.list.push({r, ...s, n:i+1, of:all.length})));
  if (!cook.list.length){ toast("These recipes have no steps yet."); return; }
  cook.idx = 0; cook.k = k; cook.open = true;
  const el = document.createElement("div"); el.className = "cook"; el.id = "cook"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Cook mode");
  document.body.append(el); document.body.style.overflow = "hidden";
  requestWake(); drawCook();
  document.addEventListener("keydown", cookKeys);
}
function closeCook(){ cook.open = false; $("#cook")?.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", cookKeys); try { cook.lock?.release(); } catch {} cook.lock = null; route(); }
function cookKeys(e){ if (e.key === "ArrowRight") move(1); else if (e.key === "ArrowLeft") move(-1); else if (e.key === "Escape") closeCook(); }
function move(d){ cook.idx = Math.max(0, Math.min(cook.list.length - 1, cook.idx + d)); drawCook(); }
async function requestWake(){ try { cook.lock = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (cook.open && document.visibilityState === "visible") requestWake(); });
function drawCook(){
  const el = $("#cook"); if (!el) return;
  const s = cook.list[cook.idx], r = s.r, multi = cook.recipes.length > 1;
  const k = cook.kMap[r.id] || cook.k;
  const times = findTimes(s.text);
  const pct = ((cook.idx + 1) / cook.list.length) * 100;
  const last = cook.idx === cook.list.length - 1;
  el.innerHTML = `
    <div class="cook-top">
      <button class="iconbtn" id="cx" aria-label="Close cook mode">${ICON.x}</button>
      <div class="ttl"><span class="label">${multi ? `Prep session · recipe ${cook.recipes.indexOf(r)+1} of ${cook.recipes.length}` : "Cook mode"}</span><div>${esc(r.title)}</div></div>
      <button class="btn sm quiet" id="ti">${cook.showIngs ? "Hide" : "Show"} ingredients</button>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="cook-body">
      <div class="cook-step">
        ${multi && s.n === 1 ? `<span class="recipe-switch">Now starting: ${esc(r.title)}${k!==1 ? ` (×${fmtNum(k)})` : ""}</span>` : ""}
        ${s.section ? `<span class="label">${esc(s.section)}</span>` : ""}
        <span class="num">Step ${s.n} of ${s.of}</span>
        <div class="txt">${esc(s.text)}</div>
        ${times.length ? `<div class="row">${times.map(t => `<button class="btn ghost" data-timer="${t.mins}" data-label="${esc(r.title)}: ${esc(t.label)}">${ICON.timer} Start ${esc(t.label)} timer</button>`).join("")}</div>` : ""}
        ${last ? `<p class="it" style="font-size:24px;margin:10px 0 0">¡Buen provecho! That's the last step.</p>` : ""}
      </div>
      ${cook.showIngs ? `<aside class="cook-ings"><h2 style="font-size:20px;margin-bottom:8px">Ingredients${k!==1 ? ` ×${fmtNum(k)}` : ""}</h2>
        ${(r.ingredients||[]).map(sec => `${sec.section ? `<h4 class="label" style="color:var(--accent);margin:12px 0 4px">${esc(sec.section)}</h4>` : ""}<ul class="checks">${(sec.items||[]).map(t => `<li><span class="box"></span><span class="txt">${scaleLine(t,k).html}</span></li>`).join("")}</ul>`).join("")}</aside>` : ""}
    </div>
    <div class="cook-foot">
      <button class="btn quiet" id="cp" ${cook.idx===0?"disabled":""}>← Back</button>
      ${last ? `<button class="btn" id="cdone">Finish</button>` : `<button class="btn" id="cn">Next step →</button>`}
    </div>`;
  $("#cx").onclick = closeCook; $("#cp").onclick = () => move(-1);
  $("#cn")?.addEventListener("click", () => move(1));
  $("#cdone")?.addEventListener("click", closeCook);
  $("#ti").onclick = () => { cook.showIngs = !cook.showIngs; drawCook(); };
  el.querySelectorAll(".cook-ings li").forEach(li => li.onclick = () => li.classList.toggle("done"));
  el.querySelectorAll("[data-timer]").forEach(b => b.onclick = () => startTimer(+b.dataset.timer, b.dataset.label));
  let x0 = null; const body = $(".cook-step", el);
  body.addEventListener("touchstart", e => x0 = e.touches[0].clientX, {passive:true});
  body.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) move(dx < 0 ? 1 : -1); x0 = null; });
}

/* ---------- timers ---------- */
const timers = []; let actx = null;
function startTimer(mins, label){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {}
  timers.push({id: Math.random(), end: Date.now() + mins*60000, label, ring:false, paused:null});
  toast(`Timer set for ${fmtNum(mins)} min`); drawTimers();
}
function beep(){ if (!actx) return; try { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(.3, actx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+.5); o.start(); o.stop(actx.currentTime+.55); } catch {} }
function drawTimers(){
  const host = $("#timers");
  host.innerHTML = timers.map(t => { const left = t.paused != null ? t.paused : Math.max(0, t.end - Date.now()); const m = Math.floor(left/60000), s = Math.floor(left/1000)%60;
    return `<div class="timer ${t.ring?"ring":""}" data-id="${t.id}"><div><b>${t.ring ? "Done!" : `${m}:${String(s).padStart(2,"0")}`}</b><small>${esc(t.label)}</small></div>
    ${t.ring ? "" : `<button data-act="pause" aria-label="${t.paused!=null?"Resume":"Pause"} timer">${t.paused!=null?"▶":"❚❚"}</button>`}<button data-act="x" aria-label="Dismiss timer">✕</button></div>`; }).join("");
  host.querySelectorAll(".timer").forEach(el => el.onclick = e => { const b = e.target.closest("button"); if (!b) return; const i = timers.findIndex(t => String(t.id) === el.dataset.id); if (i<0) return; const t = timers[i];
    if (b.dataset.act === "x") timers.splice(i,1); else if (t.paused != null){ t.end = Date.now() + t.paused; t.paused = null; } else { t.paused = Math.max(0, t.end - Date.now()); } drawTimers(); });
}
setInterval(() => { if (!timers.length) return; let ringing = false; timers.forEach(t => { if (t.paused == null && !t.ring && Date.now() >= t.end){ t.ring = true; try { navigator.vibrate?.([300,150,300]); } catch {} } if (t.ring) ringing = true; }); if (ringing && Math.floor(Date.now()/1000) % 2 === 0) beep(); drawTimers(); }, 1000);

/* ---------- editor ---------- */
let draft = null;
function blankDraft(){ return {id:null, title:"", category:"Dinner", servings:"", time:"", source:"", photoId:"", photoUrl:"", notes:[], ingredients:[{section:"",items:[]}], steps:[{section:"",items:[]}]}; }
function renderEditFor({id}){
  const r = byId(id);
  if (!r){ view.innerHTML = `<div class="wrap" style="padding-block:60px"><div class="empty"><h3>${S.loaded ? "This recipe isn't in your box" : "Opening recipe…"}</h3></div></div>`; if (!S.loaded) setTimeout(()=>{ if (currentRoute().name==="edit") route(); }, 1200); return; }
  renderEditor(r);
}
function renderEditor(r, prefill){
  if (!S.canWrite){ view.innerHTML = `<div class="wrap" style="padding-block:60px"><div class="empty"><h3>Only the owner can change recipes</h3><a class="btn" href="#home">Back to recipes</a></div></div>`; return; }
  draft = prefill ? {...blankDraft(), ...prefill} : r ? JSON.parse(JSON.stringify(r)) : blankDraft();
  if (!draft.ingredients?.length) draft.ingredients = [{section:"",items:[]}];
  if (!draft.steps?.length) draft.steps = [{section:"",items:[]}];
  drawEditor(r);
}
function drawEditor(orig){
  const cats = [...new Set([...CATS, ...S.recipes.map(x=>x.category).filter(Boolean), draft.category].filter(Boolean))];
  const isNew = !draft.id;
  view.innerHTML = `
  <form class="wrap editor" id="ed" autocomplete="off">
    <div><span class="label">${isNew ? "New recipe" : "Editing"}</span><h1 style="font-size:clamp(28px,4vw,40px);margin-top:6px">${isNew ? `Add a <span class="it">recipe</span>` : esc(draft.title || "Recipe")}</h1></div>
    <section class="panel fieldgrid">
      <label class="field" style="grid-column:1/-1"><span>Recipe name</span><input id="f-title" required value="${esc(draft.title)}" placeholder="e.g. Arroz con gandules"></label>
      <label class="field"><span>Category</span><select id="f-cat">${cats.map(c => `<option ${c===draft.category?"selected":""}>${esc(c)}</option>`).join("")}<option value="__new">New category…</option></select></label>
      <label class="field"><span>Makes / servings</span><input id="f-serv" value="${esc(draft.servings)}" placeholder="e.g. 4 servings, 18 cookies"></label>
      <label class="field"><span>Time</span><input id="f-time" value="${esc(draft.time)}" placeholder="e.g. 45 min"></label>
      <label class="field"><span>Original link (optional)</span><input id="f-src" type="url" value="${esc(draft.source)}" placeholder="https://"></label>
      <div class="field" style="grid-column:1/-1"><span>Photo</span>
        <div class="photo-pick">${thumb(draft)}<div class="row">${S.assets ? `<label class="btn quiet sm" for="f-photo">Choose photo</label><input id="f-photo" type="file" accept="image/*" hidden>` : `<span class="muted">Photos can be added by the recipe box owner.</span>`}${draft.photoUrl ? `<button type="button" class="btn sm ghost" id="rmphoto">Remove photo</button>` : ""}</div></div></div>
    </section>
    <section class="panel"><h2>Ingredients</h2><p class="muted" style="margin:0 0 12px">Type one ingredient and press Enter. Pasting several lines adds each line.</p><div id="ingsecs" style="display:flex;flex-direction:column;gap:12px"></div>
      <button type="button" class="btn sm ghost" id="addIngSec" style="margin-top:12px">+ Add a section (e.g. Frosting)</button></section>
    <section class="panel"><h2>Instructions</h2><p class="muted" style="margin:0 0 12px">Add steps one at a time. Times like “15 minutes” get a timer button in cook mode.</p><div id="stepsecs" style="display:flex;flex-direction:column;gap:12px"></div>
      <button type="button" class="btn sm ghost" id="addStepSec" style="margin-top:12px">+ Add a section (e.g. Make the sauce)</button></section>
    <section class="panel"><h2>Notes</h2><label class="field"><span class="muted" style="font-weight:400">One note per line</span><textarea id="f-notes" rows="4">${esc((draft.notes||[]).join("\n"))}</textarea></label></section>
    ${!isNew ? `<section class="panel"><h2>Delete recipe</h2><div class="danger-zone" id="dz"><button type="button" class="btn sm ghost" id="del" style="color:var(--warn);border-color:var(--warn)">Delete this recipe</button></div></section>` : ""}
    <div class="sticky-save"><span id="saveMsg" class="muted" style="margin-right:auto;align-self:center"></span><a class="btn quiet" href="${isNew ? "#home" : "#r-" + esc(draft.id)}">Cancel</a><button class="btn" type="submit" id="saveBtn">Save recipe</button></div>
  </form>`;
  const bindTop = () => {
    draft.title = $("#f-title").value; draft.servings = $("#f-serv").value; draft.time = $("#f-time").value; draft.source = $("#f-src").value;
    draft.notes = $("#f-notes").value.split("\n").map(s=>s.trim()).filter(Boolean);
  };
  ["#f-title","#f-serv","#f-time","#f-src","#f-notes"].forEach(s => $(s).addEventListener("input", bindTop));
  $("#f-cat").onchange = e => { if (e.target.value === "__new"){ const box = document.createElement("input"); box.placeholder = "Category name"; box.id = "f-newcat"; e.target.replaceWith(box); box.focus(); box.oninput = () => draft.category = box.value.trim() || "Other"; } else draft.category = e.target.value; };
  drawSections("ing"); drawSections("step");
  $("#addIngSec").onclick = () => { draft.ingredients.push({section:"New section", items:[]}); drawSections("ing"); };
  $("#addStepSec").onclick = () => { draft.steps.push({section:"New section", items:[]}); drawSections("step"); };
  $("#f-photo")?.addEventListener("change", async e => { const f = e.target.files[0]; if (!f) return; $("#saveMsg").textContent = "Uploading photo…";
    try { const blob = await shrink(f); const a = await S.assets.upload(blob); draft.photoId = a.id; draft.photoUrl = a.url; bindTop(); drawEditor(orig); $("#saveMsg").textContent = "Photo added. Save to keep it."; }

}
function drawSections(kind){
  const secs = kind === "ing" ? draft.ingredients : draft.steps;
  const host = $(kind === "ing" ? "#ingsecs" : "#stepsecs");
  const multi = secs.length > 1 || secs[0]?.section;
  host.innerHTML = secs.map((s, si) => `
    <div class="sec-edit">
      ${multi ? `<div class="row"><input class="sec-name" data-secname="${si}" value="${esc(s.section)}" placeholder="Section name (optional)" style="flex:1;min-width:0"><button type="button" class="iconbtn" data-rmsec="${si}" aria-label="Remove section">${ICON.x}</button></div>` : ""}
      <ol class="items">${s.items.map((it, i) => `<li><span class="n">${i+1}.</span>${kind==="ing" ? `<input data-item="${si}:${i}" value="${esc(it)}">` : `<textarea data-item="${si}:${i}" rows="2">${esc(it)}</textarea>`}
        <button type="button" class="iconbtn" data-mv="${si}:${i}:-1" aria-label="Move up">${ICON.up}</button><button type="button" class="iconbtn" data-mv="${si}:${i}:1" aria-label="Move down">${ICON.down}</button><button type="button" class="iconbtn" data-rm="${si}:${i}" aria-label="Remove">${ICON.x}</button></li>`).join("")}</ol>
      <div class="adder">${kind==="ing" ? `<input data-adder="ing:${si}" placeholder="e.g. 2 cups white rice">` : `<textarea data-adder="step:${si}" rows="2" placeholder="Describe the next step"></textarea>`}<button type="button" class="btn sm" data-add="${si}">Add</button></div>
    </div>`).join("");
  host.querySelectorAll("[data-item]").forEach(el => el.oninput = () => { const [si,i] = el.dataset.item.split(":").map(Number); secs[si].items[i] = el.value; });
  host.querySelectorAll("[data-secname]").forEach(el => el.oninput = () => secs[+el.dataset.secname].section = el.value);
  host.querySelectorAll("[data-rmsec]").forEach(b => b.onclick = () => { const si = +b.dataset.rmsec; if (secs.length > 1){ const moved = secs.splice(si,1)[0]; secs[Math.max(0,si-1)].items.push(...moved.items); } else secs[0].section = ""; drawSections(kind); });
  host.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { const [si,i] = b.dataset.rm.split(":").map(Number); secs[si].items.splice(i,1); drawSections(kind); });
  host.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => { const [si,i,d] = b.dataset.mv.split(":").map(Number); const j = i + d; const arr = secs[si].items; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; drawSections(kind); });
  const add = (si, focus=true) => { const inp = host.querySelector(`[data-adder="${kind}:${si}"]`); const lines = inp.value.split("\n").map(s=>s.replace(/^\s*(?:[-•▢*]|\d+[.)])\s*/,"").trim()).filter(Boolean); if (!lines.length) return; secs[si].items.push(...lines); drawSections(kind); if (focus) host.querySelector(`[data-adder="${kind}:${si}"]`).focus(); };
  host.querySelectorAll("[data-add]").forEach(b => b.onclick = () => add(+b.dataset.add));
  host.querySelectorAll("[data-adder]").forEach(inp => {
    const si = +inp.dataset.adder.split(":")[1];
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && (kind === "ing" || e.metaKey || e.ctrlKey)){ e.preventDefault(); add(si); } });
    if (kind === "ing") inp.addEventListener("paste", e => { const t = e.clipboardData?.getData("text") || ""; if (t.includes("\n")){ e.preventDefault(); inp.value = t; add(si); } });
  });
}
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file); const max = 1400; const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", .85));
  } catch { return file; }
}

let importCtl = null;
function renderImport(){
  if (!S.canWrite){ renderEditor(null); return; }
  view.innerHTML = `

      <div id="im-msg" hidden></div>

  const say = (t, err) => { msg.hidden = false; msg.className = "msg" + (err ? " err" : ""); msg.textContent = t; };
  $("#im-stop").onclick = () => importCtl?.abort();
  $("#im-go").onclick = async () => {

    if (!S.sample){ say("Importing needs Claude, which isn't available in this view. You can still type the recipe in.", true); return; }
    if (!text && !files.length){ say("Paste the page text or add a screenshot first. Claude can't open the link by itself.", true); $("#im-text").focus(); return; }
    let imgs = [];
    if (files.length){
      const lim = await S.sample.limits().catch(() => null);
      if (!lim?.images){ say("Screenshots aren't supported here. Paste the page text instead.", true); return; }
      imgs = files.slice(0, lim.images.maxCount);
    }
    const cats = [...new Set([...CATS, ...S.recipes.map(r=>r.category).filter(Boolean)])];
    const prompt = `You turn a recipe web page into structured data for a personal recipe app.
Use ONLY what is in the provided page text${imgs.length ? " and screenshots" : ""}. Ignore ads, navigation, comments, nutrition facts and the author's story. Never invent ingredients or steps. Keep the recipe's own wording and language. If quantities are given in two systems, keep both as written.
Reply with only one JSON object of this shape:
{"title": string, "category": one of ${JSON.stringify(cats)} (pick the best fit; use "Dinner" for main dishes), "servings": string (e.g. "4 servings" or ""), "time": string (total time, e.g. "35 min", or ""),
 "ingredients": [{"section": string ("" if none), "items": [string, ...]}],
 "steps": [{"section": string ("" if none), "items": [string, ...]}],
 "notes": [string, ...]}
If there is no recipe in the material, reply {"error": "short reason"}.
Source link: ${src || "(none)"}

PAGE TEXT:
${text.slice(0, 60000) || "(see screenshots)"}`;
    importCtl = new AbortController();
    $("#im-go").disabled = true; $("#im-stop").hidden = false; say("Reading the recipe… this usually takes 20–60 seconds.");
    try {
      const j = await S.sample.json(prompt, {signal: importCtl.signal, ...(imgs.length ? {images: imgs} : {})});
      if (!j || j.error || !j.title){ say(j?.error ? `Claude couldn't find a recipe: ${j.error}` : "Claude couldn't find a recipe in that text. Try copying the whole page again.", true); return; }
      const arr = v => Array.isArray(v) ? v : [];
      const secs = v => arr(v).map(s => ({section: String(s?.section||""), items: arr(s?.items).map(String)})).filter(s => s.items.length);
      renderEditor(null, {title: String(j.title), category: String(j.category || "Dinner"), servings: String(j.servings||""), time: String(j.time||""), source: src,
        ingredients: secs(j.ingredients), steps: secs(j.steps), notes: arr(j.notes).map(String)});
      toast("Recipe found. Check it over, then save.");
    } catch(e){
      const c = e?.code;
      if (c === "cancelled") say("Stopped.");
      else if (c === "not_granted" || c === "sampling_disabled") say("Claude isn't allowed for this page, so importing is off. You can still type recipes in.", true);
      else if (c === "rate_limited") say("Claude is busy for you right now. Wait a minute and try again.", true);
      else if (c === "prompt_too_large") say("That page is too long. Copy just the recipe part and try again.", true);
      else if (c === "invalid_json") say("Claude's answer came back garbled. Press Read recipe to try again.", true);
      else say("Something went wrong while reading the recipe. Try again.", true);
    } finally { $("#im-go") && ($("#im-go").disabled = false); $("#im-stop") && ($("#im-stop").hidden = true); }
  };
}

/* ---------- meal prep ---------- */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function mondayOf(d){ const x = new Date(d); x.setHours(0,0,0,0); const k = (x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
function iso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function weekKey(){ return S.planWeek || (S.planWeek = iso(mondayOf(new Date()))); }
function planOf(k = weekKey()){ return S.plans[k] || {days:{}, checked:{}, extras:[]}; }
function ensurePlan(){
  const k = weekKey();
  if (!S.db || S.planSubKey === k) return;
  S.planUnsub?.(); S.planSubKey = k;
  S.planUnsub = S.db.collection("plans").doc(k).onSnapshot(snap => { S.plans[k] = snap.exists ? {days:{}, checked:{}, extras:[], ...snap.data()} : {days:{}, checked:{}, extras:[]}; if (currentRoute().name === "prep" && !cook.open) renderPrep(); }, () => {});
}
let planWriting = Promise.resolve();
function savePlan(mut){
  const k = weekKey(); const p = JSON.parse(JSON.stringify(planOf(k))); mut(p); S.plans[k] = p;
  if (currentRoute().name === "prep") renderPrep();
  if (!S.db || !S.canWrite) return;
  planWriting = planWriting.then(() => S.db.collection("plans").doc(k).set({days:p.days, checked:p.checked, extras:p.extras, updatedAt:new Date().toISOString()})).catch(() => toast("Couldn't save your plan. Try again."));
}
function plannedBatches(p){
  const m = new Map();
  Object.values(p.days||{}).flat().forEach(e => { const r = byId(e.id); if (!r) return; const b = m.get(r.id) || {r, k:0, days:0}; b.k += e.k || 1; b.days++; m.set(r.id, b); });
  return [...m.values()];
}
function shoppingList(batches){
  // merge lines with the same wording after the amount; otherwise keep per-recipe
  const merged = new Map();
  batches.forEach(({r, k}) => allIngredients(r).forEach(line => {
    const sc = scaleLine(line, k);
    const name = (sc.qty != null ? sc.rest : line).trim().replace(/\s+/g," ");
    const key = name.toLowerCase();
    const cur = merged.get(key) || {name, qty: 0, hasQty: sc.qty != null, from: new Set(), raw: []};
    if (sc.qty != null && cur.hasQty) cur.qty += sc.qty; else if (sc.qty == null) cur.hasQty = false;
    cur.from.add(r.title); cur.raw.push(line); merged.set(key, cur);
  }));
  return [...merged.values()].map(x => ({key: x.name.toLowerCase(), text: x.hasQty && x.qty ? `${fmtNum(x.qty)} ${x.name}`.replace(/\s+/," ") : x.name, from: [...x.from]}));
}

        : `<p class="muted">Each recipe you plan shows up once here with its total batch size, so you know how much to cook on prep day.</p>`}
    </div>
  </section>`;
  const shift = n => { const d = new Date(k + "T00:00:00"); d.setDate(d.getDate() + 7*n); S.planWeek = iso(d); ensurePlan(); renderPrep(); };
  $("#wprev").onclick = () => shift(-1); $("#wnext").onclick = () => shift(1);

  view.querySelectorAll("[data-portion]").forEach(s => s.onchange = () => { const [d,j] = s.dataset.portion.split(":"); savePlan(p => p.days[d][+j].k = +s.value); });

function modal(title, inner){
  const sc = document.createElement("div"); sc.className = "scrim";
  sc.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(title)}"><header><h2 style="font-size:22px">${title}</h2><button class="iconbtn" data-close aria-label="Close">${ICON.x}</button></header>${inner}</div>`;
  document.body.append(sc);
  const close = () => sc.remove();
  sc.addEventListener("click", e => { if (e.target === sc || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", function k(e){ if (e.key === "Escape"){ close(); document.removeEventListener("keydown", k); } });
  return {el: sc, close};
}
function openRecipePicker(day){
  const m = modal(`Add a meal on <span class="it">${day}</span>`, `<div style="padding:0 20px 10px"><input id="pk-q" type="search" placeholder="Search recipes"></div><div class="list" id="pk-list"></div>`);
  const draw = () => { const q = $("#pk-q", m.el).value.toLowerCase(); const rs = S.recipes.filter(r => r.title.toLowerCase().includes(q));
    $("#pk-list", m.el).innerHTML = rs.length ? rs.map(r => `<button class="pick" data-pick="${esc(r.id)}">${thumb(r)}<span><b>${esc(r.title)}</b><br><span class="muted" style="font-size:13px">${esc(r.category||"")}</span></span></button>`).join("") : `<p class="muted" style="padding:8px">No recipes match.</p>`;
    m.el.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { savePlan(p => { p.days = p.days || {}; (p.days[day] = p.days[day] || []).push({id: b.dataset.pick, k: 1}); }); m.close(); }); };
  $("#pk-q", m.el).oninput = draw; draw(); setTimeout(() => $("#pk-q", m.el)?.focus(), 30);
}
function openDayPicker(r){
  if (!S.canWrite){ toast("Only the owner can change the meal plan."); return; }
  ensurePlan();
  const m = modal(`Plan <span class="it">${esc(r.title)}</span>`, `<div class="list" style="padding:0 20px 20px"><p class="muted" style="margin-top:0">Pick the days for this week.</p><div class="row">${DAYS.map(d => `<button class="btn quiet" data-day="${d}">${d}</button>`).join("")}</div><div class="row" style="margin-top:16px"><button class="btn" id="dp-done">Done</button></div></div>`);
  const chosen = new Set();
  m.el.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { const d = b.dataset.day; chosen.has(d) ? chosen.delete(d) : chosen.add(d); b.className = chosen.has(d) ? "btn" : "btn quiet"; });
  $("#dp-done", m.el).onclick = () => { if (chosen.size){ S.planWeek = iso(mondayOf(new Date())); savePlan(p => { p.days = p.days || {}; chosen.forEach(d => (p.days[d] = p.days[d] || []).push({id:r.id, k:1})); }); toast(`Added to ${chosen.size} day${chosen.size>1?"s":""}`); } m.close(); };
}

/* ---------- pantry ---------- */
const STOP = new Set("and or the of with for from a an de la el los las y con en sin to taste large small medium fresh dried ground whole chopped minced diced sliced optional cup cups tbsp tsp oz lb lbs can cans jar jars bag bags box boxes pack packets packet many possibly check if full is seen about".split(" "));
const AMBIG = new Set("sauce milk powder juice wine cheese cream beans paste brown seasoning mix drink container sausage sausages flour sugar".split(" "));
const ES = {sal:"salt",ajo:"garlic",ajos:"garlic",cebolla:"onion",arroz:"rice",aceite:"oil",pimienta:"pepper",azucar:"sugar","azúcar":"sugar",huevo:"egg",huevos:"eggs",vinagre:"vinegar",laurel:"bay leaves",canela:"cinnamon",comino:"cumin",cominos:"cumin",clavos:"cloves","orégano":"oregano",oregano:"oregano",tomate:"tomato",tomates:"tomatoes",mantequilla:"butter",harina:"flour",agua:"water",cilantro:"cilantro",tortillas:"tortillas",leche:"milk",papas:"potatoes"};
function words(text){ return String(text).toLowerCase().replace(/[’']s\b/g,"").replace(/\([^)]*\)/g," "); }
function phrases(text, full){
  const out = [];
  words(text).split(/,|\band\b|\bor\b|\//).forEach(x => { const ws = x.replace(/[^a-záéíóúñü\s-]/g," ").split(/\s+/).filter(w => w.length > 2 && !STOP.has(w)); if (!ws.length) return;
    if (full){ out.push(ws.join(" ")); return; }
    out.push(ws.slice(-2).join(" ")); const last = ws[ws.length-1]; if (!AMBIG.has(last)) out.push(last); });
  return out;
}
function pantryIndex(){
  if (S.pantryKeys) return S.pantryKeys;
  const keys = new Set(), cart = new Set(), miss = new Set();
  (S.pantry?.sections||[]).forEach(sec => { if (/appliance|cookware/i.test(sec.name)) return; (sec.items||[]).forEach(it => phrases(it.text).forEach(k => keys.add(k))); });
  (S.pantry?.cart||[]).forEach(it => phrases(it.text).forEach(k => cart.add(k)));
  (S.pantry?.missing||[]).forEach(it => phrases(it.text, true).forEach(k => miss.add(k.replace(/\s*in cart$/,""))));
  return S.pantryKeys = {keys:[...keys], cart:[...cart], miss:[...miss]};
}
function norm(line){
  let l = " " + words(line).replace(/[^a-záéíóúñü\s]/g," ").replace(/\s+/g," ") + " ";
  const extra = l.trim().split(" ").map(w => ES[w]).filter(Boolean);
  return extra.length ? l + extra.join(" ") + " " : l;
}
function matchAny(line, keys){
  const l = norm(line);
  return keys.some(k => l.includes(" " + k + " ") || l.includes(" " + k + "s ") || (k.endsWith("s") && l.includes(" " + k.slice(0,-1) + " ")));
}
function pantryHas(line){ if (!S.pantry) return false; const I = pantryIndex(); return matchAny(line, I.keys) && !matchAny(line, I.miss) && !matchAny(line, I.cart); }
function cartHas(line){ return !!S.pantry && matchAny(line, pantryIndex().cart); }
function savePantry(mut){
  const p = JSON.parse(JSON.stringify(S.pantry || {sections:[], missing:[], cart:[]})); mut(p); S.pantry = p; S.pantryKeys = null; renderPantry();
  if (!S.db || !S.canWrite) return;
  planWriting = planWriting.then(() => S.db.doc("pantry/home").set({...p, updatedAt: new Date().toISOString()})).catch(() => toast("Couldn't save the pantry. Try again."));
}
function renderPantry(){
  const P = S.pantry;
  if (!P){ view.innerHTML = `<section class="wrap" style="padding-block:40px"><div class="empty"><h3>${S.loaded ? "No pantry inventory yet" : "Opening your pantry…"}</h3><p class="muted">Keep track of what's in your pantry, fridge and freezer, and the shopping list will flag what you already have.</p>${S.canWrite && S.loaded ? `<div class="row">${SEED.pantry ? `<button class="btn" id="pseed">Load my inventory</button>` : ""}<button class="btn ghost" id="pstart">Start an empty pantry</button></div>` : ""}</div></section>`;
    $("#pseed")?.addEventListener("click", () => savePantry(p => Object.assign(p, JSON.parse(JSON.stringify(SEED.pantry)))));
    $("#pstart")?.addEventListener("click", () => savePantry(p => { p.sections = ["Pantry","Fridge","Freezer","Spice rack"].map(n => ({name:n, items:[]})); })); return; }
  const total = (P.sections||[]).reduce((n,s)=> n + (s.items||[]).length, 0);
  const low = (P.sections||[]).flatMap(s => (s.items||[]).filter(i => i.low).map(i => i.text));
  const sugg = S.recipes.map(r => { const ings = allIngredients(r); if (ings.length < 2) return null; const have = ings.filter(pantryHas).length; return {r, have, n: ings.length, f: have/ings.length}; }).filter(Boolean).sort((a,b)=> b.f - a.f || b.have - a.have).slice(0,6);
  const W = S.canWrite;
  const listCard = (title, key, hint, extra="") => `<section class="panel"><h2>${title}</h2><p class="muted" style="font-size:13px;margin:0 0 6px">${hint}</p>
    ${(P[key]||[]).map((it,i) => `<div class="pitem"><span class="t">${esc(it.text)}</span>${W ? `${key==="cart" ? `<button data-gotit="${i}">Bought</button>` : ""}<button data-rmlist="${key}:${i}" aria-label="Remove">✕</button>` : ""}</div>`).join("") || `<p class="muted">Nothing here.</p>`}
    ${W ? `<form class="adder" data-addlist="${key}" style="margin-top:8px"><input placeholder="Add an item"><button class="btn sm">Add</button></form>` : ""}${extra}</section>`;
  view.innerHTML = `
  <section class="wrap prep-hero">
    <div><span class="label">Home inventory</span><h1 style="margin-top:8px">What's in the <span class="it">kitchen.</span></h1>
      <p class="muted" style="max-width:56ch">Everything in your pantry, fridge and freezer. The meal prep shopping list marks what you already have, so you only buy what's missing.</p></div>
    <div class="weekcard"><span class="label">At a glance</span>
      <div><span class="muted">Items on hand</span><b>${total}</b></div><div><span class="muted">Running low</span><b>${low.length}</b></div>
      <div><span class="muted">Not found</span><b>${(P.missing||[]).length}</b></div><div><span class="muted">In Walmart cart</span><b>${(P.cart||[]).length}</b></div></div>
  </section>
  ${sugg.length ? `<section class="wrap"><div class="section-head"><h2>You can almost make…</h2><span class="muted" style="font-size:13px">Based on ingredients that match your inventory</span></div>
    <div class="suggest">${sugg.map(x => `<a class="sug" href="#r-${esc(x.r.id)}">${thumb(x.r)}<div style="min-width:0;flex:1"><b style="font-family:var(--display)">${esc(x.r.title)}</b><div class="muted" style="font-size:13px">${x.have} of ${x.n} ingredients on hand</div><div class="meter"><i style="width:${Math.round(x.f*100)}%"></i></div></div></a>`).join("")}</div></section>` : ""}
  <section class="wrap" style="padding-bottom:60px">
    <div class="section-head"><h2>Inventory</h2><span class="row"><input id="pq" type="search" placeholder="Find an item" value="${esc(S.pq||"")}" style="width:220px" aria-label="Find a pantry item">${W ? `<button class="btn sm ghost" id="addsec">+ Add area</button>` : ""}</span></div>
    <div class="pantry-grid">
      ${(P.sections||[]).map((sec, si) => { const q = (S.pq||"").toLowerCase(); const items = (sec.items||[]).map((it,i)=>({it,i})).filter(x => !q || x.it.text.toLowerCase().includes(q)); if (q && !items.length) return "";
        return `<section class="panel"><h2 style="font-size:20px">${esc(sec.name)}</h2><span class="muted" style="font-size:13px">${(sec.items||[]).length} items</span>
        <div style="margin-top:8px">${items.map(({it,i}) => `<div class="pitem ${it.low?"low":""}"><span class="t">${esc(it.text)}</span>${W ? `<button data-low="${si}:${i}">${it.low ? "Restocked" : "Low"}</button><button data-rmitem="${si}:${i}" aria-label="Remove ${esc(it.text)}">✕</button>` : ""}</div>`).join("")}</div>
        ${W ? `<form class="adder" data-additem="${si}" style="margin-top:8px"><input placeholder="Add to ${esc(sec.name)}"><button class="btn sm">Add</button></form>` : ""}</section>`; }).join("")}
      ${listCard("Not found", "missing", "Things you looked for and don't have. Add them to a shopping list when you need them.")}
      ${listCard("Walmart cart", "cart", "Already in your online cart. Tap Bought when it arrives to move it into the pantry.")}
      ${low.length ? `<section class="panel"><h2>Running low</h2><p class="muted" style="font-size:13px;margin:0 0 6px">Restock these on your next trip.</p>${low.map(t => `<div class="pitem"><span class="t">${esc(t)}</span></div>`).join("")}</section>` : ""}
    </div>
  </section>`;
  const pq = $("#pq"); pq.oninput = () => { S.pq = pq.value; const pos = pq.selectionStart; renderPantry(); const n = $("#pq"); n.focus(); n.setSelectionRange(pos,pos); };
  $("#addsec")?.addEventListener("click", () => savePantry(p => p.sections.push({name:"New area", items:[]})));
  view.querySelectorAll("[data-low]").forEach(b => b.onclick = () => { const [si,i] = b.dataset.low.split(":").map(Number); savePantry(p => p.sections[si].items[i].low = !p.sections[si].items[i].low); });
  view.querySelectorAll("[data-rmitem]").forEach(b => b.onclick = () => { const [si,i] = b.dataset.rmitem.split(":").map(Number); savePantry(p => p.sections[si].items.splice(i,1)); });
  view.querySelectorAll("[data-additem]").forEach(f => f.onsubmit = e => { e.preventDefault(); const v = f.querySelector("input").value.trim(); if (!v) return; const si = +f.dataset.additem; savePantry(p => p.sections[si].items.push({text:v, low:false})); setTimeout(()=> view.querySelector(`[data-additem="${si}"] input`)?.focus(), 0); });
  view.querySelectorAll("[data-addlist]").forEach(f => f.onsubmit = e => { e.preventDefault(); const v = f.querySelector("input").value.trim(); if (!v) return; const k = f.dataset.addlist; savePantry(p => (p[k] = p[k] || []).push({text:v})); setTimeout(()=> view.querySelector(`[data-addlist="${k}"] input`)?.focus(), 0); });
  view.querySelectorAll("[data-rmlist]").forEach(b => b.onclick = () => { const [k,i] = b.dataset.rmlist.split(":"); savePantry(p => p[k].splice(+i,1)); });
  view.querySelectorAll("[data-gotit]").forEach(b => b.onclick = () => { const i = +b.dataset.gotit; savePantry(p => { const it = p.cart.splice(i,1)[0]; let sec = p.sections.find(s => s.name === "Just bought"); if (!sec){ sec = {name:"Just bought", items:[]}; p.sections.unshift(sec); } sec.items.push({text: it.text, low:false}); }); toast("Moved to your pantry"); });
}

boot();
})();
</script>
